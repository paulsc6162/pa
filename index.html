<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161f">
<title>PA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --ground:#12161f;
  --raised:#1b2230;
  --line:#2c3446;
  --paper:#e8e9ec;
  --muted:#8a93a6;
  --brass:#c8a25c;
  --alert:#d4614e;
  --ok:#6e9e7e;
  --serif: ui-serif, "New York", Iowan Old Style, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ground); color:var(--paper);
  font:400 16px/1.5 var(--sans);
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:2rem;line-height:1.15}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:.4em 0;max-width:64ch}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--paper);background:var(--ground);
  border:1px solid var(--line);border-radius:8px;padding:.65em .8em;width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px
}
label{display:block;margin:.9rem 0 .3rem;color:var(--muted);font-size:.85rem}
.row{display:flex;gap:.6rem}
.row>*{flex:1}
.btn{
  background:var(--brass);color:#20180a;font-weight:600;
  padding:.8em 1.1em;border-radius:10px;text-align:center;display:block;width:100%;
}
.btn.ghost{background:none;color:var(--paper);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--alert);border:1px solid var(--alert)}
.chip{
  display:inline-block;font-size:.72rem;padding:.2em .55em;border-radius:5px;
  border:1px solid var(--line);color:var(--muted);vertical-align:2px
}
.chip.biz{border-color:var(--brass);color:var(--brass)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------------------------------------------------------------- gate */
#gate{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:2rem 1.4rem calc(2rem + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
}
#gate[hidden]{display:none}
#gate h1{margin-bottom:.2rem}
#gate .lede{color:var(--muted);margin-bottom:2rem}
.keyhole{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--brass);
  position:relative;margin-bottom:1.6rem
}
.keyhole::after{
  content:"";position:absolute;left:50%;top:11px;width:4px;height:20px;
  background:var(--brass);transform:translateX(-50%);border-radius:2px
}

/* ---------------------------------------------------------------- app */
#app[hidden]{display:none}
main{
  padding:calc(1rem + env(safe-area-inset-top)) 1.1rem 6.5rem;
  max-width:640px;margin:0 auto;      /* a phone column, centred on a tablet */
}
section[hidden]{display:none}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.2rem}
.head .date{font-family:var(--serif);font-size:.95rem;color:var(--muted)}

/* brief hero */
.brief-hero{border-bottom:1px solid var(--line);padding-bottom:1.1rem;margin-bottom:1.2rem}
.brief-hero h1{margin-bottom:.35rem}
.weather{display:flex;align-items:center;gap:.55rem;color:var(--muted);font-size:.95rem}
.weather b{color:var(--paper);font-weight:600}
.flag{color:var(--brass);font-family:var(--serif);font-size:1.05rem;margin-top:.5rem}

/* list items carry urgency on the left rule */
.item{
  border-left:2px solid var(--line);padding:.65rem 0 .65rem .8rem;margin-bottom:.15rem;
  display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left
}
.item.due{border-left-color:var(--alert)}
.item.soon{border-left-color:var(--brass)}
.item.done{opacity:.45}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500}
.item .when{color:var(--muted);font-size:.85rem;white-space:nowrap}
.group{margin:1.6rem 0 .6rem;color:var(--muted);font-family:var(--serif);font-size:1rem}
.empty{color:var(--muted);padding:1.2rem 0;font-family:var(--serif)}

/* tabs */
#tabs{
  position:fixed;left:50%;transform:translateX(-50%);
  width:100%;max-width:640px;bottom:0;z-index:14;display:flex;
  background:rgba(18,22,31,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:.5rem .4rem calc(.5rem + env(safe-area-inset-bottom));
}
#tabs button{flex:1;padding:.45rem 0;color:var(--muted);font-size:.7rem;text-align:center}
#tabs button svg{display:block;margin:0 auto .2rem;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
#tabs button[aria-current="page"]{color:var(--brass)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(6,8,12,.6)}
#sheet .panel{
  position:absolute;left:50%;transform:translateX(-50%);
  width:100%;max-width:640px;bottom:0;max-height:92dvh;overflow:auto;
  background:var(--raised);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:1.2rem 1.1rem calc(1.6rem + env(safe-area-inset-bottom));
}
#sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 1rem}
@media (prefers-reduced-motion:no-preference){
  #sheet.open .panel{animation:rise .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{transform:translateX(-50%) translateY(14px);opacity:.6}
               to{transform:translateX(-50%) translateY(0);opacity:1}}
}
.docimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:.8rem 0}

/* ask */
.bubble{padding:.75rem .9rem;border-radius:12px;margin-bottom:.6rem;max-width:88%}
.bubble.me{background:var(--raised);margin-left:auto}
.bubble.pa{border:1px solid var(--line)}
.bubble.pa p:first-child{margin-top:0}
.askbar{
  position:fixed;left:50%;transform:translateX(-50%);
  width:100%;max-width:640px;z-index:14;
  bottom:calc(58px + env(safe-area-inset-bottom));
  padding:.6rem .9rem;background:var(--ground);border-top:1px solid var(--line);
  display:flex;gap:.5rem;align-items:center
}
.mic{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:50%;font-size:1.1rem}
.mic.on{border-color:var(--alert);color:var(--alert)}

#toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);
  padding:.6rem 1rem;border-radius:10px;font-size:.9rem;z-index:30;display:none;max-width:88vw
}
#toast.show{display:block}

#face{position:fixed;inset:0;z-index:8;background:#05060a}
#face[hidden]{display:none}
#face-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#face-cap{
  position:absolute;left:50%;transform:translateX(-50%);
  width:calc(100% - 2.4rem);max-width:620px;z-index:10;
  bottom:calc(9.5rem + env(safe-area-inset-bottom));
  color:var(--paper);font-size:1rem;line-height:1.5;text-align:center;
  text-shadow:0 2px 16px rgba(0,0,0,.98);max-height:24vh;overflow:auto
}
#face-x{
  position:absolute;top:calc(.7rem + env(safe-area-inset-top));right:.9rem;z-index:10;
  border:1px solid var(--line);color:var(--muted);
  padding:.35rem .8rem;border-radius:8px;font-size:.78rem;
  background:rgba(5,6,10,.7)
}

#wake-dot{
  position:fixed;top:calc(.5rem + env(safe-area-inset-top));right:.9rem;z-index:15;
  font-size:.7rem;color:var(--brass);background:rgba(18,22,31,.85);
  padding:.25rem .5rem;border-radius:6px;border:1px solid var(--line);
  pointer-events:none
}
#wake-bar{
  position:fixed;left:.9rem;right:.9rem;bottom:calc(66px + env(safe-area-inset-bottom));
  z-index:16;background:var(--raised);border:1px solid var(--brass);color:var(--brass);
  padding:.7rem;border-radius:10px;font-size:.9rem
}
</style>
</head>
<body>

<!-- ============================================================== gate -->
<div id="gate">
  <div class="keyhole"></div>
  <h1>PA</h1>
  <p class="lede" id="gate-lede">Sign in, sir, then we shall open the vault.</p>

  <div id="step-signin">
    <label for="g-email">Email</label>
    <input id="g-email" type="email" autocomplete="username" inputmode="email">
    <label for="g-pw">Account password</label>
    <input id="g-pw" type="password" autocomplete="current-password">
    <div style="height:1.2rem"></div>
    <button class="btn" id="g-signin">Sign in</button>
  </div>

</div>

<!-- =============================================================== app -->
<div id="app" hidden>
<main>

  <section id="view-brief">
    <div class="brief-hero">
      <div class="date" id="b-date"></div>
      <h1 id="b-greet">Today</h1>
      <div class="weather" id="b-weather"><span class="muted">Checking the forecast…</span></div>
      <div class="flag" id="b-flag" hidden></div>
    </div>
    <div id="b-today"></div>
    <div id="b-ahead"></div>
  </section>

  <section id="view-vault" hidden>
    <div class="head"><h2>Vault</h2><button class="chip" id="v-add">Add document</button></div>
    <div id="v-list"></div>
  </section>

  <section id="view-cal" hidden>
    <div class="head"><h2>Calendar</h2><button class="chip" id="c-add">Add entry</button></div>
    <div id="c-list"></div>
  </section>

  <section id="view-people" hidden>
    <div class="head"><h2>People &amp; money</h2><button class="chip" id="p-add">Add</button></div>
    <div id="p-list"></div>
  </section>

  <section id="view-ask" hidden>
    <div class="head"><h2>Ask</h2><span style="display:flex;gap:.5rem;flex:0 0 auto"><button class="chip" id="a-face">Face</button><button class="chip" id="a-mem">Memory</button><button class="chip" id="a-voice">Voice</button></span></div>
    <div id="a-thread"></div>
    <div style="height:4rem"></div>
  </section>

</main>

<div class="askbar" id="askbar" hidden>
  <input id="a-input" placeholder="Anything I should know, sir?" enterkeyhint="send">
  <button class="mic" id="a-mic" aria-label="Speak">🎙</button>
</div>

<nav id="tabs">
  <button data-view="brief" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Today</button>
  <button data-view="vault">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Vault</button>
  <button data-view="cal">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-view="people">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3.1-5.6 7-5.6s7 2.1 7 5.6"/></svg>People</button>
  <button data-view="ask">
    <svg viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/></svg>Ask</button>
</nav>
</div>

<div id="sheet"><div class="scrim"></div><div class="panel"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="face" hidden>
  <canvas id="face-cv"></canvas>
  <div id="face-cap"></div>
  <button id="face-x" aria-label="Hide the face">Hide</button>
</div>
<div id="toast"></div>
<div id="wake-dot" hidden></div>
<button id="wake-bar" hidden>Tap to start listening again</button>

<script>
/* =====================================================================
   PA — v1
   Static HTML/JS · Supabase REST · AES-GCM encrypted on device
   ===================================================================== */

const CFG = {
  // ---- FILL THESE IN (Supabase → Project Settings → API) -------------
  url:  'https://glimkvmtqdldbinumzwg.supabase.co',
  anon: 'sb_publishable_5NPBxxfv9duXIEcsnqGJ9g_aIuel95-',
  // --------------------------------------------------------------------
  askEndpoint: '/.netlify/functions/ask',     // persona + web search
  speakEndpoint: '/.netlify/functions/speak', // ElevenLabs, falls back on-device
  rememberEndpoint: '/.netlify/functions/remember', // what it learns about you
  weatherEndpoint: '/.netlify/functions/weather',   // Met Office, falling back
  kdfIters: 600000
};

/* ------------------------------------------------------------- helpers */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

const DAY = 86400000;
const todayISO = () => new Date().toLocaleDateString('en-CA');       // YYYY-MM-DD, local
const parseISO = d => { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd); };
const daysUntil = d => Math.round((parseISO(d) - parseISO(todayISO())) / DAY);

function prettyDate(d, opts){
  return parseISO(d).toLocaleDateString('en-GB',
    opts || {weekday:'short', day:'numeric', month:'short'});
}
function prettyWhen(iso, allDay){
  const dt = new Date(iso);
  const date = dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  if (allDay) return date;
  return date + ' ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function relative(days){
  if (days < 0)  return Math.abs(days) + (Math.abs(days)===1?' day ago':' days ago');
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  return 'in ' + days + ' days';
}

/* --------------------------------------------------------------- state */
const S = {
  session: null,      // supabase auth session
  key: null,          // day key: diary, contacts, subscriptions, memory
  docKey: null,       // document key: never stored, Face ID or passphrase
  master: null,       // only while documents are open, for re-sealing
  docs: [], events: [], contacts: [], subs: [],
  weather: null, holiday: null,
  view: 'brief'
};

/* ---------------------------------------------------------------- auth */
const store = {
  get s(){ try { return JSON.parse(localStorage.getItem('pa.session')||'null'); } catch { return null; } },
  set s(v){ v ? localStorage.setItem('pa.session', JSON.stringify(v)) : localStorage.removeItem('pa.session'); }
};

async function signIn(email, password){
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=password`, {
    method:'POST',
    headers:{'apikey':CFG.anon,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  if (!r.ok) throw new Error('That combination means nothing to me, sir.');
  const j = await r.json();
  j.expires_at = Date.now() + (j.expires_in - 60) * 1000;
  S.session = j; store.s = j;
  return j;
}

async function refresh(){
  const s = store.s; if (!s?.refresh_token) return null;
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST',
    headers:{'apikey':CFG.anon,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: s.refresh_token})
  });
  if (!r.ok){ store.s = null; return null; }
  const j = await r.json();
  j.expires_at = Date.now() + (j.expires_in - 60) * 1000;
  S.session = j; store.s = j;
  return j;
}

function signOut(){
  store.s = null; S.session = null;
  keys.forget();                       // the day key must not outlive the account
  S.key = null; S.docKey = null; S.master = null;
  location.reload();
}

/* ------------------------------------------------------ supabase REST */
async function api(path, opts = {}){
  if (S.session && Date.now() > S.session.expires_at) await refresh();
  const r = await fetch(`${CFG.url}/rest/v1/${path}`, {
    ...opts,
    headers:{
      'apikey': CFG.anon,
      'Authorization': `Bearer ${S.session.access_token}`,
      'Content-Type': 'application/json',
      'Prefer': opts.method === 'POST' ? 'return=representation'
              : opts.method === 'PATCH' ? 'return=representation' : '',
      ...(opts.headers||{})
    }
  });
  if (!r.ok) throw new Error(await r.text());
  if (r.status === 204) return null;
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

const uid = () => S.session.user.id;

const db = {
  select: (t, q='') => api(`${t}?${q}`),
  insert: (t, row)   => api(t, {method:'POST', body: JSON.stringify({...row, user_id: uid()})}),
  update: (t, id, p) => api(`${t}?id=eq.${id}`, {method:'PATCH', body: JSON.stringify(p)}),
  remove: (t, id)    => api(`${t}?id=eq.${id}`, {method:'DELETE'})
};

/* ------------------------------------------------------------- crypto */
const te = new TextEncoder(), td = new TextDecoder();

function b64(buf){
  const b = new Uint8Array(buf); let s = '';
  for (let i=0;i<b.length;i+=8192) s += String.fromCharCode(...b.subarray(i,i+8192));
  return btoa(s);
}
function unb64(str){
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(pass, saltB64, iters){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  // extractable, because the master key has to be split into a day key and
  // a document key, and that means exporting it
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: unb64(saltB64), iterations: iters, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
}

const encStr = plain => encWith(S.key, plain);
const decStr = blob  => decWith(S.key, blob);
const encJSON = o => encStr(JSON.stringify(o));
async function decJSON(blob){
  try { const s = await decStr(blob); return s ? JSON.parse(s) : {}; }
  catch { return {__error:true}; }
}

/* First run: create salt + verifier. Later runs: check passphrase. */
async function openVault(pass){
  let meta = (await db.select('pa_meta', `user_id=eq.${uid()}&select=*`))[0];
  let master;

  if (!meta){
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    master = await deriveKey(pass, salt, CFG.kdfIters);
    const verifier = await encWith(master, 'pa-vault-ok');
    meta = (await db.insert('pa_meta',
      {user_id: uid(), kdf_salt: salt, verifier, kdf_iters: CFG.kdfIters}))[0];
    S.master = master;
    S.key = await keys.derive(master, 'everyday');
    S.docKey = await keys.derive(master, 'documents');
    await keys.remember(S.key);
    return true;
  }

  master = await deriveKey(pass, meta.kdf_salt, meta.kdf_iters || CFG.kdfIters);
  const check = await decWith(master, meta.verifier).catch(() => null);
  if (check !== 'pa-vault-ok') throw new Error('That is not the passphrase, sir.');

  S.master = master;
  S.key = await keys.derive(master, 'everyday');
  S.docKey = await keys.derive(master, 'documents');
  await keys.remember(S.key);
  return false;
}

/* ------------------------------------------------------------- images */
/* Re-encoding through canvas resizes AND strips EXIF, so a document photo
   carries no GPS coordinates into the vault. */
function shrink(file, maxEdge = 1800, quality = .82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality).split(',')[1]);   // base64, no header
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image.')); };
    img.src = url;
  });
}

/* ---------------------------------------------------------------- MRZ */
/* The two chevron lines on a passport are designed to be machine read and
   carry check digits, so they are far more reliable than the printed
   fields. Paste or dictate them and every field fills itself. */
function parseMRZ(raw){
  const lines = raw.toUpperCase().split(/[\n\r]+/)
                   .map(l => l.replace(/\s+/g,''))      // OCR loves adding spaces
                   .filter(l => l.length > 25 && /^[A-Z0-9<]+$/.test(l));
  const l2 = lines.find(l => /^[A-Z0-9<]{40,44}$/.test(l) && /\d{6}/.test(l.slice(13,19)));
  if (!l2) return null;
  const yy = +l2.slice(21,23), mm = l2.slice(23,25), dd = l2.slice(25,27);
  if (!/^\d{2}$/.test(mm) || !/^\d{2}$/.test(dd)) return null;
  const year = 2000 + yy;                       // expiry is always future-dated
  const l1 = lines.find(l => l.startsWith('P<')) || '';
  const names = l1.slice(5).split('<<');
  return {
    number: l2.slice(0,9).replace(/</g,''),
    expiry: `${year}-${mm}-${dd}`,
    holder: names.length > 1
      ? (names[1].replace(/</g,' ').trim() + ' ' + names[0].replace(/</g,' ').trim()).trim()
      : ''
  };
}

/* -------------------------------------------------------------- voice */
/* ElevenLabs where it can, the on-device voice when it can't. iOS refuses
   to play audio until the user has touched the page once, so the first
   gesture primes a silent buffer and everything after that just works. */
const audio = new Audio();
let audioPrimed = false;
function primeAudio(){
  if (audioPrimed) return;
  audioPrimed = true;
  /* iOS refuses speechSynthesis until it has been called once from inside
     a real tap — and a volume-zero utterance does not count. This one is
     real but inaudibly short. */
  try {
    speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance('.');
    u.volume = 0.05; u.rate = 2;      // rate above 2 is rejected outright on iOS
    speechSynthesis.speak(u);         // completing this proves nothing; only
                                      // a real line starting counts as unlocked
  } catch {}
  audio.src = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tAwAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAADAAABgAAqKioqKioqKioqKioqKioqKlVVVVVVVVVVVVVVVVVVVVWAgICAgICAgICAgICAgICAqqqqqqqqqqqqqqqqqqqqqtXV1dXV1dXV1dXV1dXV1dX//////////////////////wAAAABMYXZjNTguMTMAAAAAAAAAAAAAAAAkAAAAAAAAAAABgJAV4H4AAAAAAAAAAAAAAAAAAAD/+0DEAAPAAAGkAAAAIAAANIAAAARMQU1FMy4xMDBVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=';
  audio.play().catch(() => {});
}

const voice = {
  unlocked: false,
  list: [], chosen: localStorage.getItem('pa.voice') || '',
  rate:  parseFloat(localStorage.getItem('pa.rate')  || '0.96'),
  pitch: parseFloat(localStorage.getItem('pa.pitch') || '0.92'),
  remote: localStorage.getItem('pa.remote') === 'on',

  load(){
    this.list = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    if (!this.chosen){
      const daniel = this.list.find(v => /daniel/i.test(v.name));
      this.chosen = daniel ? daniel.name : (this.list[0] || {}).name || '';
    }
  },

  local(text){
    if (!('speechSynthesis' in window)) return;
    const line = String(text).replace(/\s+/g, ' ').trim();
    if (!line) return;

    speechSynthesis.cancel();
    // Safari drops an utterance queued in the same tick as cancel(), and
    // sometimes leaves synthesis paused after a spell in the background.
    setTimeout(() => {
      try {
        speechSynthesis.resume();
        const u = new SpeechSynthesisUtterance(line);
        if (!this.list.length) this.load();
        const v = this.list.find(x => x.name === this.chosen);
        if (v) u.voice = v;
        u.rate = this.rate; u.pitch = this.pitch;
        u.volume = 1;
        u.onstart = () => {
          voice.unlocked = true;
          face.startTalk(line, u.rate);
        };
        u.onboundary = e => face.resync(e.charIndex, line);
        u.onend = u.onerror = () => face.stopTalk();
        speechSynthesis.speak(u);

        // if nothing actually started, have one more go
        setTimeout(() => {
          if (!speechSynthesis.speaking && !speechSynthesis.pending){
            try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch {}
          }
        }, 260);
      } catch {}
    }, 60);
  },

  async speak(text){
    const line = String(text || '').replace(/\s+/g, ' ').trim();
    if (!line) return;
    const cap = $('#face-cap');
    if (cap) cap.textContent = line;
    if (!this.remote) return this.local(line);
    try {
      const r = await fetch(CFG.speakEndpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: line})
      });
      if (!r.ok) throw new Error('tts');
      const url = URL.createObjectURL(await r.blob());
      speechSynthesis.cancel();
      face.attach(audio);
      audio.src = url;
      audio.onplay  = () => face.startTalk(line, 1);
      audio.onended = () => { face.stopTalk(); URL.revokeObjectURL(url); };
      await audio.play();
    } catch {
      this.local(line);                 // network down, no key, quota gone
    }
  },

  /* iOS only permits speech that starts synchronously inside the tap that
     asked for it. No timeouts, no awaits, no cancel-then-speak. Returns
     true if it started something, false if it stopped something. */
  toggleFromTap(text){
    if (!('speechSynthesis' in window)) return false;

    if (speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      face.stopTalk();
      return false;
    }
    if (audio && !audio.paused && !audio.ended){
      audio.pause(); audio.currentTime = 0;
      face.stopTalk();
      return false;
    }

    const line = String(text || '').replace(/\s+/g, ' ').trim();
    if (!line) return false;
    const cap = $('#face-cap');
    if (cap) cap.textContent = line;

    if (!this.list.length) this.load();
    const u = new SpeechSynthesisUtterance(line);
    const v = this.list.find(x => x.name === this.chosen);
    if (v) u.voice = v;
    u.rate = this.rate; u.pitch = this.pitch; u.volume = 1;
    u.onstart = () => { this.unlocked = true; face.startTalk(line, u.rate); };
    u.onboundary = e => face.resync(e.charIndex, line);
    u.onend = u.onerror = () => face.stopTalk();
    speechSynthesis.speak(u);
    return true;
  },

  set(name){ this.chosen = name; localStorage.setItem('pa.voice', name); prefs.save(); },
  /* Spoken synchronously inside the tap, before anything asynchronous
     happens. This single utterance is what unlocks speech for the whole
     session; Face ID and decryption that follow are far too late. */
  openingLine(text){
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      if (!this.list.length) this.load();
      const u = new SpeechSynthesisUtterance(text);
      const v = this.list.find(x => x.name === this.chosen);
      if (v) u.voice = v;
      u.rate = this.rate; u.pitch = this.pitch; u.volume = 1;
      u.onstart = () => { this.unlocked = true; face.startTalk(text, u.rate); };
      u.onend = u.onerror = () => face.stopTalk();
      speechSynthesis.speak(u);
    } catch {}
  },

  setRate(v){ this.rate = v; localStorage.setItem('pa.rate', String(v)); prefs.save(); },
  setPitch(v){ this.pitch = v; localStorage.setItem('pa.pitch', String(v)); prefs.save(); },
  setRemote(on){ this.remote = on; localStorage.setItem('pa.remote', on ? 'on' : 'off'); prefs.save(); }
};
if ('speechSynthesis' in window){
  voice.load();
  speechSynthesis.onvoiceschanged = () => voice.load();
}

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(onText){
  if (!Rec){ toast('This browser will not take dictation, sir. Typing it is.'); return; }
  const btn = $('#a-mic');
  if (rec){ rec.stop(); rec = null; prosody.stop(0); btn.classList.remove('on'); return; }

  rec = new Rec();
  rec.lang = 'en-GB'; rec.interimResults = false; rec.maxAlternatives = 1;

  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    lastReading = prosody.stop(text.trim().split(/\s+/).length);
    onText(text);
  };
  rec.onend = () => { rec = null; prosody.stop(0); btn.classList.remove('on'); };
  rec.onerror = () => { prosody.stop(0); toast('I did not catch that, sir.'); };

  btn.classList.add('on');
  wake.pause();
  rec.addEventListener('end', () => wake.resume());
  // If the mic is busy or refused, dictation still works — just without the reading.
  prosody.start().finally(() => { try { rec && rec.start(); } catch {} });
}

/* ---------------------------------------------------------- load data */
async function loadAll(){
  const q = `user_id=eq.${uid()}&select=*`;
  const [events, contacts, subs] = await Promise.all([
    db.select('pa_events',        q + '&order=starts_at.asc'),
    db.select('pa_contacts',      q),
    db.select('pa_subscriptions', q + '&cancelled=eq.false')
  ]);
  const open = async rows => { for (const r of rows) r._ = await decJSON(r.payload_enc); return rows; };
  S.events   = await open(events);
  S.contacts = await open(contacts);
  S.subs     = await open(subs);
  if (S.docKey) await loadDocs();      // only when their key is in hand
}

/* -------------------------------------------------- weather & holidays */
let wxAt = 0, wxDay = '';

async function loadContext(force){
  // a forecast is stale after 30 minutes, and always stale on a new day
  const fresh = !force && Date.now() - wxAt < 1800000 && wxDay === todayISO();
  if (fresh) return;

  try {
    const hol = await fetch('https://www.gov.uk/bank-holidays.json',
      {cache: 'no-store'}).then(r => r.json());
    const t = todayISO();
    const list = hol['england-and-wales'].events;
    S.holiday = list.find(e => e.date === t) || null;
    S.nextHol = list.find(e => e.date > t) || null;
  } catch { /* CORS or offline: see README for the proxy */ }

  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const la = pos.coords.latitude.toFixed(4), lo = pos.coords.longitude.toFixed(4);
    try {
      const u = CFG.weatherEndpoint + '?lat=' + la + '&lon=' + lo + '&_=' + Date.now();
      S.weather = await fetch(u, {cache: 'no-store'}).then(r => r.json());
      wxAt = Date.now(); wxDay = todayISO();
      renderBrief();
    } catch {}
  }, () => {}, {enableHighAccuracy: false, maximumAge: 600000, timeout: 10000});
}

function audioPlaying(){
  return !!(audio && !audio.paused && !audio.ended && audio.currentTime > 0);
}



/* The forecast arrives already normalised, whichever service supplied it. */
function weatherLine(i){
  i = i || 0;
  const d = S.weather && S.weather.daily;
  if (!d || !d.text || d.text[i] === undefined) return null;
  return {
    text: d.text[i],
    hi: d.hi[i], lo: d.lo[i],
    rain: d.rain[i], wind: d.wind[i],
    source: S.weather.source
  };
}

/* -------------------------------------------------------- what is due */
function docDue(d){
  const date = d.notice_date || d.expiry_date;
  if (!date) return null;
  return {date: date, days: daysUntil(date), isNotice: !!d.notice_date};
}

function upcoming(days){
  days = days || 5;
  const out = [];
  const t = parseISO(todayISO());

  for (const e of S.events){
    if (e.done || !e.starts_at) continue;
    const when = new Date(e.starts_at);
    if (e.recurs === 'yearly'){
      when.setFullYear(t.getFullYear());
      if (when < t) when.setFullYear(t.getFullYear() + 1);
    }
    const dd = daysUntil(when.toLocaleDateString('en-CA'));
    if (dd >= 0 && dd <= days)
      out.push({days: dd, title: e._.title, kind: e.kind, tag: e.owner_tag,
                important: e.important, when: when.toISOString(), allDay: e.all_day, ref: e});
  }

  for (const d of S.docs){
    const due = docDue(d);
    if (!due) continue;
    const inWarning = due.days <= d.lead_days;
    if (due.days >= 0 && (due.days <= days || inWarning))
      out.push({days: due.days, kind: 'document', tag: d.owner_tag, important: true,
                title: (d._.label || d.doc_type) + (due.isNotice ? ' notice deadline' : ' expires'),
                ref: d});
  }

  for (const s of S.subs){
    if (!s.next_charge) continue;
    const dd = daysUntil(s.next_charge);
    if (dd >= 0 && dd <= days)
      out.push({days: dd, kind: 'subscription', tag: s.owner_tag,
                title: s._.name + ' renews' + (s._.amount ? ' \u2014 \u00a3' + s._.amount : ''),
                ref: s});
  }

  return out.sort((a, b) => a.days - b.days);
}

/* ---------------------------------------------------------- rendering */
function itemRow(o){
  const cls = o.days === 0 ? 'due' : o.days <= 2 ? 'soon' : '';
  const tag = o.tag === 'business' ? '<span class="chip biz">business</span>' : '';
  const when = (o.days === 0 && o.when && !o.allDay)
    ? new Date(o.when).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
    : relative(o.days);
  return '<button class="item ' + cls + '" data-open="' + (o.ref ? o.ref.id : '') +
    '" data-kind="' + o.kind + '"><span class="t"><b>' + esc(o.title) +
    '</b><span class="small muted">' + esc(o.kind) + '</span> ' + tag +
    '</span><span class="when">' + when + '</span></button>';
}

function renderBrief(){
  const now = new Date();
  $('#b-date').textContent = now.toLocaleDateString('en-GB',
    {weekday:'long', day:'numeric', month:'long'});
  const h = now.getHours();
  $('#b-greet').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';

  const w = weatherLine(0);
  $('#b-weather').innerHTML = w
    ? '<span><b>' + w.hi + '\u00b0</b> / ' + w.lo + '\u00b0 &nbsp;' + esc(w.text) +
      (w.rain >= 30 ? ' \u00b7 ' + w.rain + '% rain' : '') +
      (w.source ? ' <span class="small muted">\u00b7 ' + esc(w.source) + '</span>' : '') +
      '</span>'
    : '<span class="muted">No forecast \u2014 location is off.</span>';

  const flag = $('#b-flag');
  if (S.holiday){
    flag.hidden = false;
    flag.textContent = 'Bank holiday \u2014 ' + S.holiday.title + '.';
  } else if (S.nextHol && daysUntil(S.nextHol.date) <= 7){
    flag.hidden = false;
    flag.textContent = S.nextHol.title + ' ' + relative(daysUntil(S.nextHol.date)) + '.';
  } else flag.hidden = true;

  const all = upcoming(5);
  const today = all.filter(o => o.days === 0);
  const ahead = all.filter(o => o.days > 0);

  $('#b-today').innerHTML = today.length
    ? '<div class="group">On today</div>' + today.map(itemRow).join('')
    : '<div class="empty">Nothing booked today, sir.</div>';
  $('#b-ahead').innerHTML = ahead.length
    ? '<div class="group">Next five days</div>' + ahead.map(itemRow).join('')
    : '';
}

function renderVault(){
  if (docsLocked()) return $('#v-list').innerHTML =
    '<div class="empty">Your documents sit behind Face ID, sir.' +
    '<div style="height:.9rem"></div>' +
    '<button class="btn" onclick="requireDocs(renderVault)">Open documents</button></div>';
  if (!S.docs.length){
    $('#v-list').innerHTML =
      '<div class="empty">The vault is empty, sir. A passport or a licence would be a sensible start.</div>';
    return;
  }
  const groups = {personal: [], business: []};
  for (const d of S.docs) groups[d.owner_tag].push(d);

  $('#v-list').innerHTML = Object.keys(groups).filter(k => groups[k].length).map(k =>
    '<div class="group">' + (k === 'business' ? 'Business' : 'Personal') + '</div>' +
    groups[k].map(d => {
      const due = docDue(d);
      const cls = !due ? '' : due.days <= 0 ? 'due' : due.days <= d.lead_days ? 'soon' : '';
      return '<button class="item ' + cls + '" data-doc="' + d.id + '"><span class="t"><b>' +
        esc(d._.label || d.doc_type) + '</b><span class="small muted">' +
        (d.has_image ? 'photo held \u00b7 ' : '') + esc(d.doc_type.replace(/_/g, ' ')) +
        '</span></span><span class="when">' +
        (due ? prettyDate(due.date, {day:'numeric', month:'short', year:'2-digit'}) : '\u2014') +
        '</span></button>';
    }).join('')).join('');
}

function renderCal(){

    ? live.map(e => '<button class="item" data-evt="' + e.id + '"><span class="t"><b>' +

function renderPeople(){

/* ------------------------------------------------------------- vcards */
/* Safari cannot reach the phone's address book — there is no API for it.
   What it can do is read a vCard file, which is how iOS exports contacts.
   Everything is parsed and encrypted here; the file never leaves the phone. */
const vcard = {
  /* Folded lines continue on the next line starting with a space or tab. */
  unfold(text){
    return text.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '');
  },

  decode(v, params){
    if (/quoted-printable/i.test(params)){
      v = v.replace(/=\n/g, '')
           .replace(/=([0-9A-F]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)));
      try { v = decodeURIComponent(escape(v)); } catch {}
    }
    return v.replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\n/gi, ' ').trim();
  },

  /* BDAY comes as 19800114, 1980-01-14, or --0114 with the year withheld. */
  birthday(raw){
    const v = raw.replace(/[^0-9-]/g, '');
    let m = v.match(/^(\d{4})-?(\d{2})-?(\d{2})$/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = v.match(/^--?-?(\d{2})-?(\d{2})$/);
    if (m) return '1900-' + m[1] + '-' + m[2];      // year unknown
    return null;
  },

  parse(text){
    const out = [];
    const blocks = this.unfold(text).split(/BEGIN:VCARD/i).slice(1);

    for (const block of blocks){
      const c = {name:'', phone:'', email:'', relationship:'', birthday:null};
      let bestPhone = 0;

      for (const line of block.split('\n')){
        const at = line.indexOf(':');
        if (at < 1) continue;
        const left = line.slice(0, at);
        const val = this.decode(line.slice(at + 1), left);
        if (!val) continue;
        const prop = left.split(';')[0].replace(/^item\d+\./i, '').toUpperCase();
        const params = left.toUpperCase();

        if (prop === 'FN') c.name = val;
        else if (prop === 'N' && !c.name){
          const p = val.split(';');
          c.name = ((p[1] || '') + ' ' + (p[0] || '')).trim();
        }
        else if (prop === 'TEL'){
          // prefer mobile, then a preferred number, then anything
          const rank = /CELL|MOBILE|IPHONE/.test(params) ? 3
                     : /PREF/.test(params) ? 2 : 1;
          if (rank > bestPhone){ bestPhone = rank; c.phone = val.replace(/[^\d+]/g, ''); }
        }
        else if (prop === 'EMAIL' && !c.email) c.email = val;
        else if (prop === 'ORG' && !c.relationship) c.relationship = val.split(';')[0];
        else if (prop === 'TITLE' && !c.relationship) c.relationship = val;
        else if (prop === 'BDAY') c.birthday = this.birthday(val);
      }

      if (c.name && (c.phone || c.email)) out.push(c);
    }
    return out;
  },

  async importFile(file, onProgress){
    const text = await file.text();
    const found = this.parse(text);
    if (!found.length) return {added:0, skipped:0, found:0};

    const have = new Set(S.contacts.map(c => (c._.name || '').toLowerCase().trim()));
    let added = 0, skipped = 0, n = 0;

    for (const c of found){
      n++;
      if (onProgress) onProgress(n, found.length);
      if (have.has(c.name.toLowerCase().trim())){ skipped++; continue; }
      try {
        await db.insert('pa_contacts', {
          owner_tag: 'personal',
          birthday: c.birthday,
          payload_enc: await encJSON({
            name: c.name, phone: c.phone, email: c.email,
            relationship: c.relationship
          })
        });
        // a real birthday earns a yearly reminder; a withheld year does not
        if (c.birthday && !c.birthday.startsWith('1900')){
          await db.insert('pa_events', {
            kind:'birthday', owner_tag:'personal',
            starts_at: new Date(c.birthday + 'T09:00:00').toISOString(),
            all_day:true, important:true, recurs:'yearly',
            alerts:[{minutes_before:1440}],
            payload_enc: await encJSON({title: c.name + "'s birthday", notes:''})
          });
        }
        added++;
        have.add(c.name.toLowerCase().trim());
      } catch { skipped++; }
    }
    return {added, skipped, found: found.length};
  }
};

/* ------------------------------------------------------------- memory */
/* What it has learned about you. Encrypted at rest like everything else,
   decrypted here, sent to the model as plain notes. You can read and
   delete every line of it from Ask, Memory. */
const mem = {
  items: [],

  async load(){
    const rows = await db.select('pa_memory',
      `user_id=eq.${uid()}&retired=eq.false&select=*` +
      `&order=weight.desc,last_seen.desc&limit=150`);
    for (const r of rows) r._ = await decJSON(r.payload_enc);
    this.items = rows.filter(r => r._ && r._.text);
  },

  /* Persona notes always travel; facts by weight and recency. */
  forModel(){
    const persona = this.items.filter(m => m.kind === 'persona').slice(0, 10);
    const rest    = this.items.filter(m => m.kind !== 'persona').slice(0, 45);
    return [...persona, ...rest].map(m => ({kind: m.kind, text: m._.text}));
  },

  norm: t => t.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(Boolean),

  /* Cheap overlap check so the same fact doesn't pile up twenty times. */
  similar(a, b){
    const A = new Set(this.norm(a)), B = this.norm(b);
    if (!A.size || !B.length) return 0;
    return B.filter(w => A.has(w)).length / Math.max(A.size, B.length);
  },

  async record(userText, paText){
    try {
      const r = await fetch(CFG.rememberEndpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          exchange: `Paul: ${userText}\n\nPA: ${paText}`
        })
      });
      if (!r.ok) return;
      const {memories} = await r.json();
      if (!memories || !memories.length) return;

      for (const m of memories){
        const hit = this.items.find(x => this.similar(x._.text, m.text) > 0.65);
        if (hit){
          await db.update('pa_memory', hit.id, {
            times_seen: hit.times_seen + 1,
            last_seen: new Date().toISOString(),
            weight: Math.min(3, Math.max(hit.weight, m.weight))
          });
        } else {
          await db.insert('pa_memory', {
            kind: m.kind, weight: m.weight,
            payload_enc: await encJSON({text: m.text})
          });
        }
      }
      await this.load();
      await this.prune();
    } catch { /* memory is a luxury; never let it break a reply */ }
  },

  async prune(){
    if (this.items.length <= 250) return;
    const doomed = [...this.items]
      .sort((a, b) => a.weight - b.weight ||
        new Date(a.last_seen) - new Date(b.last_seen))
      .slice(0, this.items.length - 250);
    for (const d of doomed) await db.update('pa_memory', d.id, {retired: true});
    await this.load();
  },

  async forget(id){
    await db.remove('pa_memory', id);
    await this.load();
  },

  async forgetAll(){
    await api(`pa_memory?user_id=eq.${uid()}`, {method: 'DELETE'});
    this.items = [];
  }
};

/* ------------------------------------------------------------ prosody */
/* Not hearing. A reading of how you sounded, measured on this phone and
   never sent as audio — pace, volume, pitch range, hesitation, each
   judged against your own usual rather than some absolute. */
const prosody = {
  stream: null, ctx: null, frames: [], t0: 0, running: false,

  base: JSON.parse(localStorage.getItem('pa.vocal') || '{"rms":[],"range":[],"wpm":[]}'),

  saveBase(){ localStorage.setItem('pa.vocal', JSON.stringify(this.base)); },

  push(key, v){
    const a = this.base[key];
    a.push(v);
    if (a.length > 25) a.shift();
  },

  band(key, v){
    const a = this.base[key];
    if (a.length < 5 || !isFinite(v)) return null;      // not enough to judge yet
    const sorted = [...a].sort((x, y) => x - y);
    const med = sorted[Math.floor(sorted.length / 2)];
    if (!med) return null;
    const r = v / med;
    return r < 0.75 ? 'lower than usual'
         : r > 1.3  ? 'higher than usual'
         : 'about usual';
  },

  async start(){
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({audio: true});
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = this.ctx.createMediaStreamSource(this.stream);
      const an = this.ctx.createAnalyser();
      an.fftSize = 2048;
      src.connect(an);
      const buf = new Float32Array(an.fftSize);
      this.frames = []; this.t0 = Date.now(); this.running = true;

      const tick = () => {
        if (!this.running) return;
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        this.frames.push({rms, hz: rms > 0.012 ? this.pitch(buf, this.ctx.sampleRate) : 0});
        setTimeout(tick, 80);
      };
      tick();
      return true;
    } catch { this.running = false; return false; }
  },

  /* Autocorrelation. Rough, cheap, good enough for a range. */
  pitch(buf, rate){
    const n = buf.length;
    let best = -1, bestCorr = 0;
    for (let lag = 32; lag < 512; lag++){
      let c = 0;
      for (let i = 0; i < n - lag; i++) c += buf[i] * buf[i + lag];
      if (c > bestCorr){ bestCorr = c; best = lag; }
    }
    const hz = best > 0 ? rate / best : 0;
    return (hz > 60 && hz < 400) ? hz : 0;
  },

  stop(words){
    this.running = false;
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) this.ctx.close().catch(() => {});
    this.stream = this.ctx = null;

    const f = this.frames;
    if (f.length < 8) return null;

    const secs = (Date.now() - this.t0) / 1000;
    const voiced = f.filter(x => x.rms > 0.012);
    if (voiced.length < 5) return null;

    const rms = voiced.reduce((s, x) => s + x.rms, 0) / voiced.length;
    const hzs = f.map(x => x.hz).filter(Boolean).sort((a, b) => a - b);
    const range = hzs.length > 4
      ? hzs[Math.floor(hzs.length * 0.9)] - hzs[Math.floor(hzs.length * 0.1)] : NaN;
    const wpm = words && secs > 0.5 ? (words / secs) * 60 : NaN;
    const silence = 1 - (voiced.length / f.length);

    const reading = {
      seconds: +secs.toFixed(1),
      volume: this.band('rms', rms),
      pace: this.band('wpm', wpm),
      pitch_range: this.band('range', range),
      hesitation: silence > 0.45 ? 'a lot of pausing'
                : silence > 0.28 ? 'some pausing' : 'fluent'
    };

    this.push('rms', rms);
    if (isFinite(range)) this.push('range', range);
    if (isFinite(wpm)) this.push('wpm', wpm);
    this.saveBase();

    // Nothing useful to say until there's a baseline to compare against.
    return (reading.volume || reading.pace || reading.pitch_range) ? reading : null;
  }
};

/* Conversation memory for the model. Trimmed, never persisted. */
let chat = [];
let lastReading = null;   // set by the mic, cleared after one use

/* A few things are answered here rather than by the model: they must be
   instant, correct, and work with no signal. The wording carries the
   character so the seam doesn't show. */
const pick = a => a[Math.floor(Math.random() * a.length)];

const OPENERS = {
  clear: ['Nothing in the diary, sir.', 'Your day is mercifully empty.',
          'Not a thing booked. Enjoy it while it lasts.'],
  busy:  ['Here is the damage, sir.', 'On today, sir:', 'Your day, such as it is:']
};

function greeting(){
  const h = new Date().getHours();
  return h < 12 ? 'Good morning, sir.' : h < 18 ? 'Good afternoon, sir.' : 'Good evening, sir.';
}

function briefSentence(days, opts){
  days = days || 5;
  opts = opts || {};
  const list = upcoming(days);
  const today = list.filter(o => o.days === 0);
  const ahead = list.filter(o => o.days > 0);
  const w = weatherLine(0);
  let out = opts.noGreeting ? '' : greeting() + ' ';

  if (S.holiday) out += 'It is a bank holiday, ' + S.holiday.title + '. ';
  else if (S.nextHol && daysUntil(S.nextHol.date) <= 7)
    out += S.nextHol.title + ' falls ' + relative(daysUntil(S.nextHol.date)) + '. ';

  if (w){
    out += 'Outside it is ' + w.text + ', topping out at ' + w.hi + ' degrees';
    if (w.wind >= 30) out += ', and blowing ' + w.wind + ' miles an hour';
    out += w.rain >= 60 ? '. I would take the coat. '
         : w.rain >= 30 ? ', with a fair chance of rain. '
         : '. ';
  }

  out += today.length
    ? pick(OPENERS.busy) + ' ' + today.map(o => o.title).join('; ') + '. '
    : pick(OPENERS.clear) + ' ';

  if (ahead.length)
    out += 'Looking ahead: ' + ahead.map(o => o.title + ' ' + relative(o.days)).join('; ') + '.';

  if (opts.close) out += ' Anything else, sir?';
  return out.trim().replace(/\s{2,}/g, ' ');
}

/* Everything except images goes to the model, so it can actually hold a
   conversation about your life rather than pattern-matching at you. */
function buildContext(){
  const fmt = d => d ? prettyDate(d, {day:'numeric', month:'long', year:'numeric'}) : null;
  return {
    today: new Date().toLocaleDateString('en-GB',
      {weekday:'long', day:'numeric', month:'long', year:'numeric'}),
    bank_holiday: S.holiday ? S.holiday.title : null,
    next_bank_holiday: S.nextHol ? {name: S.nextHol.title, date: fmt(S.nextHol.date)} : null,
    weather_today: weatherLine(0),
    diary: S.events.filter(e => !e.done).map(e => ({
      what: e._.title, kind: e.kind, side: e.owner_tag,
      when: e.starts_at ? prettyWhen(e.starts_at, e.all_day) : null,
      repeats: e.recurs === 'none' ? null : e.recurs,
      flagged_important: e.important || undefined,
      notes: e._.notes || undefined
    })),
    vault: S.docs.map(d => ({
      what: d._.label || d.doc_type, type: d.doc_type, side: d.owner_tag,
      expires: fmt(d.expiry_date),
      notice_deadline: fmt(d.notice_date),
      days_left: d.expiry_date || d.notice_date ? docDue(d).days : null,
      reference: d._.number || undefined,
      notes: d._.notes || undefined,
      photo_held: d.has_image
    })),
    contacts: S.contacts.map(c => ({
      name: c._.name, relationship: c._.relationship || undefined,
      phone: c._.phone || undefined, email: c._.email || undefined,
      birthday: fmt(c.birthday)
    })),
    subscriptions: S.subs.map(s => ({
      name: s._.name, amount_gbp: s._.amount || undefined,
      billed: s.cycle, next_charge: fmt(s.next_charge), side: s.owner_tag
    }))
  };
}

async function askModel(q){
  thinking(true);
  try {
    const r = await fetch(CFG.askEndpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question: q,
        context: locked() ? {today: new Date().toLocaleDateString('en-GB',
                    {weekday:'long', day:'numeric', month:'long', year:'numeric'}),
                  weather_today: weatherLine(0),
                  bank_holiday: S.holiday ? S.holiday.title : null,
                  vault_locked: true}
                : buildContext(),
        history: chat.slice(-12, -1),
        memory: locked() ? [] : mem.forModel(),
        voice_reading: lastReading
      })
    });
    lastReading = null;
    if (!r.ok){
      let why = '';
      try { const j = await r.json(); why = (j.detail || '').slice(0, 180); } catch {}
      throw new Error(why || ('HTTP ' + r.status));
    }
    const j = await r.json();
    thinking(false);
    if (!j.answer) throw new Error('empty');
    let answer = j.answer;
    const mood = answer.match(/\[mood:\s*([a-z]+)\s*\]\s*$/i);
    if (mood){ face.setMood(mood[1].toLowerCase()); answer = answer.slice(0, mood.index).trim(); }
    say(esc(answer), answer);
    if (!locked()) mem.record(q, answer);   // deliberately not awaited
    return;
  } catch (e){
    thinking(false);
    say('I am afraid I cannot reach my wits at the moment, sir. ' +
        'Either the connection is down or the key needs looking at.');
    if (e && e.message) toast(String(e.message).slice(0, 90));
  }
}

async function ask(q){
  const t = q.toLowerCase().trim();
  if (compose.active) return compose.handle(q);
  if (/\b(open|unlock)\b.*\b(vault|documents?)\b|^unlock\b/.test(t)){
    heard(q);
    say('Your face, sir.', 'Your face, sir.');
    requireDocs(() => show('vault'));
    return;
  }
  if (/\b(lock|shut|close)\b.*\b(vault|documents?)\b/.test(t)){
    heard(q); relock(); return say('Shut, sir.', 'Shut, sir.');
  }
  if (compose.looksLikeMessage(q)){ heard(q); return compose.begin(q); }
  heard(q);

  // Instant, offline-safe, and the one thing you ask most often.
  if (/^(what'?s?\s+)?(on\s+)?today\??$|what.*(on|happening).*today|brief|status report/.test(t)){
    const line = briefSentence(5);
    return say(esc(line).replace(/\. /g, '.<br>'), line);
  }

  // Pulling a document up on screen has to happen locally: the model
  // never sees the images and cannot open anything.
  if (/\b(show|open|pull up|display|find)\b/.test(t)){
    const hit = S.docs.find(d => {
      const hay = ((d._.label || '') + ' ' + d.doc_type.replace(/_/g, ' ')).toLowerCase();
      return hay.split(/\s+/).some(w => w.length > 3 && t.includes(w));
    });
    if (hit){
      say('Here you are, sir.', 'Here you are, sir.');
      return sheetViewDoc(hit.id);
    }
  }
  if (docsLocked() && /\b(passport|licence|license|document|expir)\b/.test(t))
    return requireDocs(() => ask(q));

  // Adding something is a form, not a conversation.
  if (/^(add|note|remind me|put in|book)\b/.test(t)) return quickEvent(q, t);

  return askModel(q);
}

/* ------------------------------------------------------------ visemes */
/* The on-device voice gives us no audio to measure, so the mouth is
   driven from the text instead: work out which sound is roughly being
   spoken at each moment and set the shape for it. Not true lip sync —
   nothing free is — but it forms recognisable shapes instead of flapping.

   Each viseme is {jaw, funnel, pucker, wide, ms}. */
const VIS = {
  a:{j:0.80,f:0.00,p:0.00,w:0.30,ms:125},
  e:{j:0.45,f:0.00,p:0.00,w:0.60,ms:115},
  i:{j:0.25,f:0.00,p:0.00,w:0.75,ms:105},
  o:{j:0.55,f:0.35,p:0.60,w:0.00,ms:125},
  u:{j:0.30,f:0.45,p:0.85,w:0.00,ms:120},
  m:{j:0.02,f:0.00,p:0.15,w:0.00,ms:85},     // lips together
  f:{j:0.14,f:0.25,p:0.00,w:0.35,ms:80},     // teeth on lip
  s:{j:0.16,f:0.00,p:0.00,w:0.55,ms:85},
  t:{j:0.28,f:0.00,p:0.00,w:0.30,ms:70},
  k:{j:0.38,f:0.00,p:0.00,w:0.20,ms:75},
  r:{j:0.32,f:0.20,p:0.35,w:0.00,ms:85},
  l:{j:0.34,f:0.00,p:0.00,w:0.25,ms:80},
  sh:{j:0.30,f:0.40,p:0.55,w:0.00,ms:95},
  th:{j:0.20,f:0.10,p:0.00,w:0.40,ms:80},
  _:{j:0.00,f:0.00,p:0.00,w:0.00,ms:95},     // gap between words
  '.':{j:0.00,f:0.00,p:0.00,w:0.00,ms:260}   // end of a clause
};

/* Crude but effective: English spelling maps to mouth shape far better
   than it maps to sound. Digraphs first, then single letters. */
/* The estimate above is generic; a given voice at a given rate is not.
   After each utterance we compare predicted length against actual and
   nudge a calibration factor, so sync improves with use. */
let paceFactor = parseFloat(localStorage.getItem('pa.pace') || '1') || 1;

function calibratePace(predictedMs, actualMs){
  if (!predictedMs || !actualMs || actualMs < 700) return;
  const ratio = actualMs / predictedMs;
  if (ratio < 0.4 || ratio > 2.5) return;          // nonsense, ignore
  paceFactor = paceFactor * 0.8 + (paceFactor * ratio) * 0.2;
  paceFactor = Math.min(2, Math.max(0.5, paceFactor));
  localStorage.setItem('pa.pace', paceFactor.toFixed(3));
}

function visemes(text, rate){
  const t = text.toLowerCase();
  const out = [];
  const push = k => { const v = VIS[k]; if (v) out.push(v); };

  for (let i = 0; i < t.length; i++){
    const two = t.slice(i, i + 2);
    if (two === 'sh' || two === 'ch' || two === 'zh' || two === 'ju'){ push('sh'); i++; continue; }
    if (two === 'th'){ push('th'); i++; continue; }
    if (two === 'ph'){ push('f'); i++; continue; }
    if (two === 'ck' || two === 'qu'){ push('k'); i++; continue; }
    if (two === 'oo' || two === 'ou' || two === 'ow'){ push('u'); i++; continue; }
    if (two === 'ee' || two === 'ea'){ push('i'); i++; continue; }
    if (two === 'ai' || two === 'ay'){ push('e'); i++; continue; }

    const c = t[i];
    if ('aà'.includes(c)) push('a');
    else if ('eé'.includes(c)) push('e');
    else if ('iy'.includes(c)) push('i');
    else if (c === 'o') push('o');
    else if ('uw'.includes(c)) push('u');
    else if ('mbp'.includes(c)) push('m');
    else if ('fv'.includes(c)) push('f');
    else if ('szxc'.includes(c)) push('s');
    else if ('tdnjg'.includes(c)) push('t');
    else if ('kqh'.includes(c)) push('k');
    else if (c === 'r') push('r');
    else if (c === 'l') push('l');
    else if (c === ' ') push('_');
    else if ('.,;:!?'.includes(c)) push('.');
  }

  // build a timeline, matched to the speaking rate and the learned pace
  const scale = paceFactor / (rate || 1);
  let at = 0;
  return out.map(v => {
    const frame = {t: at, j: v.j, f: v.f, p: v.p, w: v.w};
    at += v.ms * scale;
    return frame;
  });
}

/* --------------------------------------------------------------- face */
/* A scanned head with a full ARKit blendshape rig, rendered in WebGL as
   polished metal. Jaw, lips, eyelids and brows are real morph targets, so
   the mouth follows the speech rather than approximating it. three.js and
   the model load only the first time the face is opened, so there is no
   cost if you never use it. */
const face = {
  ready:false, loading:false, broken:false, open:false, raf:null, t0:0,
  mouth:0, aim:0, blink:0, nextBlink:0,
  jaw:0, funnel:0, pucker:0, wide:0,          // current mouth shape
  brow:0, browAim:-0.12, smile:0, smileAim:0.04,
  mood:'dry', talking:false, env:null, headSize:0, pending:null,
  line:null, lineT0:0, lineRate:0.96,
  dict:null, inf:null, mat:null, root:null,
  renderer:null, scene:null, camera:null,
  auto: localStorage.getItem('pa.face') !== 'off',

  LIB: 'https://cdn.jsdelivr.net/npm/three@0.128.0/',

  MOODS: {
    dry:      {brow:-0.12, smile: 0.04, colour:0xb9c2cf, rough:0.16},
    amused:   {brow: 0.28, smile: 0.34, colour:0xc2c4bd, rough:0.15},
    concerned:{brow: 0.62, smile:-0.26, colour:0xc0a9a4, rough:0.24},
    flat:     {brow: 0.00, smile: 0.00, colour:0xa8adb6, rough:0.30},
    pleased:  {brow: 0.20, smile: 0.46, colour:0xb4c2b8, rough:0.17},
    sharp:    {brow:-0.42, smile:-0.10, colour:0xc6bda4, rough:0.12}
  },

  script(src){
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
      document.head.appendChild(s);
    });
  },

  async load(){
    if (this.ready || this.broken) return this.ready;
    if (this.loading) return false;
    this.loading = true;
    try {
      await this.script(this.LIB + 'build/three.min.js');
      await this.script(this.LIB + 'examples/js/libs/meshopt_decoder.js');
      await this.script(this.LIB + 'examples/js/loaders/GLTFLoader.js');
      await this.build();
      this.ready = true;
    } catch (e){
      this.broken = true;
      toast('The face will not load, sir. Everything else is unaffected.');
    }
    this.loading = false;
    return this.ready;
  },

  /* Chrome is mostly reflection, so this painted studio does more work
     than the lights: an overhead panel, two strips, a dark floor. */
  studio(){
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.00,'#cdd6e4'); g.addColorStop(0.42,'#7d8798');
    g.addColorStop(0.50,'#2a2f3a'); g.addColorStop(0.52,'#161a22');
    g.addColorStop(1.00,'#05070b');
    x.fillStyle = g; x.fillRect(0,0,1024,512);
    x.fillStyle = '#ffffff';
    x.globalAlpha = 0.95; x.fillRect(180,16,300,96);
    x.globalAlpha = 0.55; x.fillRect(640,40,150,60);
    x.globalAlpha = 0.30; x.fillRect(0,150,1024,10);
    x.globalAlpha = 0.22;
    x.fillStyle = '#9fd8ff'; x.fillRect(820,120,60,200);
    x.fillStyle = '#ffd9a0'; x.fillRect(90,130,44,180);
    x.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  },

  build(){
    return new Promise((res, rej) => {
      const r = new THREE.WebGLRenderer({canvas: $('#face-cv'), antialias: true});
      r.setPixelRatio(Math.min(devicePixelRatio, 2));
      r.outputEncoding = THREE.sRGBEncoding;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = 1.05;
      this.renderer = r;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060a);
      scene.environment = this.studio();
      this.scene = scene;
      this.camera = new THREE.PerspectiveCamera(26, 1, 0.01, 100);

      const key  = new THREE.DirectionalLight(0xffffff, 1.5);  key.position.set(-1.4,1.8,1.6);
      const fill = new THREE.DirectionalLight(0xbcd4ff, 0.55); fill.position.set(2.2,0.2,1.1);
      const rim  = new THREE.DirectionalLight(0xffd9a8, 0.75); rim.position.set(0.4,0.9,-2.0);
      scene.add(new THREE.AmbientLight(0xffffff, 0.22), key, fill, rim);

      const loader = new THREE.GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      loader.load('facecap.glb', gltf => {
        const root = gltf.scene;
        this.root = root; scene.add(root);

        const chrome = new THREE.MeshStandardMaterial({
          color: 0xb9c2cf, metalness: 1.0, roughness: 0.16, envMapIntensity: 1.35,
          // without these two, r128 silently ignores every blendshape
          morphTargets: true, morphNormals: true
        });
        this.mat = chrome;
        root.traverse(o => {
          if (!o.isMesh) return;
          o.material = (o.name === 'eyeLeft' || o.name === 'eyeRight')
            ? new THREE.MeshStandardMaterial({color:0x0d1016, metalness:0.9,
                roughness:0.08, morphTargets:true, morphNormals:true})
            : chrome;
          if (o.morphTargetDictionary){
            this.dict = o.morphTargetDictionary; this.inf = o.morphTargetInfluences;
          }
        });

        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        root.position.sub(box.getCenter(new THREE.Vector3()));
        this.headSize = size.y;
        this.frame();
        res();
      }, undefined, () => rej(new Error('model')));
    });
  },

  /* Aim above centre so the caption and controls sit under the chin
     rather than across it. */
  /* Aim below the head so it sits high on screen, clear of the caption
     and the controls. On a wide screen frame by width instead of height,
     or the head shrinks into the middle. */
  frame(){
    if (!this.camera || !this.headSize) return;
    const el = $('#face');
    const wide = el.clientWidth / Math.max(1, el.clientHeight);
    const fit = this.headSize * (wide > 1 ? 1.30 : 1.02);
    const d = fit / (2 * Math.tan(this.camera.fov * Math.PI / 360));
    this.camera.position.set(0, 0, d);
    this.camera.lookAt(0, -this.headSize * 0.30, 0);
  },

  size(){
    if (!this.renderer) return;
    const el = $('#face');
    const w = el.clientWidth, h = el.clientHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w/h;
    this.camera.updateProjectionMatrix();
    this.frame();
  },

  async show(){
    if (this.broken) return;
    $('#face').hidden = false;
    if (!this.ready){
      $('#face-cap').textContent = 'One moment, sir…';
      const ok = await this.load();
      if (!ok){ $('#face').hidden = true; return; }
      $('#face-cap').textContent = '';
    }
    if (this.open) return;
    this.open = true;
    this.t0 = performance.now();
    this.nextBlink = performance.now() + 1600;
    this.size();
    this.loop();
  },

  hide(){
    this.open = false;
    $('#face').hidden = true;
    cancelAnimationFrame(this.raf);
  },

  setMood(m){
    const M = this.MOODS[m];
    if (!M) return;
    this.mood = m;
    this.browAim = M.brow; this.smileAim = M.smile;
    if (this.mat){ this.mat.color.setHex(M.colour); this.mat.roughness = M.rough; }
  },

  startTalk(text, rate){
    this.talking = true;
    this.spokeAt = performance.now();
    if (this.auto && !this.open) this.show();
    this.lineRate = rate || 0.96;
    this.line = visemes(String(text || ''), this.lineRate);
    this.lineT0 = performance.now();
    const words = Math.max(1, (text || '').trim().split(/\s+/).length);
    this.env = {t0: performance.now(), beats: Math.round(words*1.6), per: 135};
  },

  /* If the browser tells us which word it has reached, use it to pull the
     timeline back into step. Safari often stays silent here. */
  resync(charIndex, text){
    if (!this.line || !text) return;
    const ahead = visemes(String(text).slice(0, charIndex), this.lineRate);
    if (!ahead.length) return;
    this.lineT0 = performance.now() - ahead[ahead.length - 1].t;
  },

  stopTalk(){
    if (this.pending){
      const cap = $('#face-cap');
      if (cap) cap.textContent = 'Tap me, sir.';
    }
    if (this.spokeAt && this.line && this.line.length){
      calibratePace(this.line[this.line.length - 1].t,
                    performance.now() - this.spokeAt);
    }
    this.spokeAt = 0;
    this.talking = false; this.env = null; this.aim = 0; this.line = null;
  },

  /* Where in the line we are, and what the mouth should be doing there. */
  shape(){
    if (!this.talking || !this.line || !this.line.length) return null;
    const ms = performance.now() - this.lineT0;
    const L = this.line;
    if (ms > L[L.length - 1].t + 400) return null;
    let lo = 0, hi = L.length - 1;
    while (lo < hi){
      const mid = (lo + hi + 1) >> 1;
      if (L[mid].t <= ms) lo = mid; else hi = mid - 1;
    }
    return L[lo];
  },

  /* With the ElevenLabs voice the audio is measurable, so the mouth can
     follow the actual sound instead of an envelope. */
  attach(audioEl){
    try {
      if (this.an || typeof THREE === 'undefined') return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audioEl);
      this.an = ctx.createAnalyser(); this.an.fftSize = 512;
      src.connect(this.an); this.an.connect(ctx.destination);
      this.buf = new Uint8Array(this.an.frequencyBinCount);
    } catch {}
  },

  level(){
    if (this.an && this.talking){
      this.an.getByteFrequencyData(this.buf);
      let s = 0; for (let i = 2; i < 40; i++) s += this.buf[i];
      return Math.min(1, s/(38*128));
    }
    if (!this.talking || !this.env) return 0;
    const i = (performance.now() - this.env.t0)/this.env.per;
    if (i > this.env.beats + 1){ this.talking = false; return 0; }
    return Math.sin((i % 1)*Math.PI)*(0.5 + 0.5*Math.abs(Math.sin(i*2.7)));
  },

  loop(){
    if (!this.open) return;
    this.raf = requestAnimationFrame(() => this.loop());
    const now = performance.now(), t = (now - this.t0)/1000;
    const set = (n, v) => { if (this.dict && n in this.dict) this.inf[this.dict[n]] = v; };

    const sh = this.shape();
    // with the better voice the audio gives us loudness; the text gives
    // us the shape. Together they read far better than either alone.
    const loud = this.an ? this.level() : 1;
    const tgt = sh ? {j: sh.j*loud, f: sh.f*loud, p: sh.p*loud, w: sh.w*loud}
                   : {j:0, f:0, p:0, w:0};
    const k = 0.34;
    this.jaw    += (tgt.j - this.jaw)*k;
    this.funnel += (tgt.f - this.funnel)*k;
    this.pucker += (tgt.p - this.pucker)*k;
    this.wide   += (tgt.w - this.wide)*k;
    this.mouth = this.jaw;
    this.brow  += (this.browAim - this.brow)*0.07;
    this.smile += (this.smileAim - this.smile)*0.07;
    if (now > this.nextBlink){ this.blink = 1; this.nextBlink = now + 2400 + Math.random()*4200; }
    this.blink = Math.max(0, this.blink - 0.16);

    set('jawOpen', this.jaw*0.80);
    set('mouthFunnel', this.funnel);
    set('mouthPucker', this.pucker);
    set('mouthStretch_L', this.wide*0.55); set('mouthStretch_R', this.wide*0.55);
    set('mouthLowerDown_L', this.jaw*0.26); set('mouthLowerDown_R', this.jaw*0.26);
    set('mouthUpperUp_L', this.jaw*0.16 + this.wide*0.20);
    set('mouthUpperUp_R', this.jaw*0.16 + this.wide*0.20);
    set('mouthClose', this.jaw < 0.05 && this.talking ? 0.35 : 0);
    set('jawForward', this.pucker*0.18);
    set('eyeBlink_L', this.blink);   set('eyeBlink_R', this.blink);
    set('browInnerUp', Math.max(0, this.brow));
    set('browOuterUp_L', Math.max(0, this.brow)*0.6);
    set('browOuterUp_R', Math.max(0, this.brow)*0.6);
    set('browDown_L', Math.max(0, -this.brow)); set('browDown_R', Math.max(0, -this.brow));
    set('mouthSmile_L', Math.max(0, this.smile)); set('mouthSmile_R', Math.max(0, this.smile));
    set('mouthFrown_L', Math.max(0, -this.smile)); set('mouthFrown_R', Math.max(0, -this.smile));

    const gx = Math.sin(t*0.37)*0.5 + Math.sin(t*0.11)*0.3;
    const gy = Math.sin(t*0.29 + 2)*0.3;
    set('eyeLookOut_L', Math.max(0, gx)); set('eyeLookIn_R', Math.max(0, gx));
    set('eyeLookIn_L', Math.max(0, -gx)); set('eyeLookOut_R', Math.max(0, -gx));
    set('eyeLookUp_L', Math.max(0, gy)*0.5); set('eyeLookUp_R', Math.max(0, gy)*0.5);
    set('eyeLookDown_L', Math.max(0, -gy)*0.5); set('eyeLookDown_R', Math.max(0, -gy)*0.5);

    if (this.root){
      this.root.rotation.y = Math.sin(t*0.23)*0.16 + Math.sin(t*0.52)*0.04;
      this.root.rotation.x = Math.sin(t*0.31 + 1)*0.05;
      this.root.rotation.z = Math.sin(t*0.19 + 2)*0.025;
    }
    this.renderer.render(this.scene, this.camera);
  }
};

window.addEventListener('resize', () => { if (face.open) face.size(); });

/* ------------------------------------------------------------- keys */
/* Two keys, both from the one passphrase.

   The day key opens the diary, contacts, subscriptions and memory. It is
   kept on this device so the app can read them the moment it opens — your
   phone's own lock is what protects it.

   The document key opens passports, licences and anything with a number
   or a photograph in it. It is never stored. Face ID produces it, or the
   passphrase does, and it lives in memory only until the vault shuts. */
const keys = {
  async derive(master, purpose){
    const raw = await crypto.subtle.exportKey('raw', master);
    const base = await crypto.subtle.importKey('raw', raw, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'HKDF', hash:'SHA-256', salt: te.encode('pa.split.v1'), info: te.encode(purpose)},
      base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  },

  /* The day key survives a restart. Saved raw, deliberately: anything
     cleverer here would be theatre, since the unwrapping code sits in the
     same page as the wrapped key. */
  async remember(dayKey){
    try {
      const raw = await crypto.subtle.exportKey('raw', dayKey);
      localStorage.setItem('pa.daykey', b64(raw));
    } catch {}
  },
  async recall(){
    const s = localStorage.getItem('pa.daykey');
    if (!s) return null;
    try {
      return await crypto.subtle.importKey('raw', unb64(s), 'AES-GCM', true,
        ['encrypt','decrypt']);
    } catch { return null; }
  },
  forget(){ localStorage.removeItem('pa.daykey'); }
};

/* Encryption is per key now, so the callers say which one they mean. */
async function encWith(key, plain){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, te.encode(plain));
  return b64(iv) + '.' + b64(ct);
}
async function decWith(key, blob){
  if (!blob) return null;
  const [ivB, ctB] = blob.split('.');
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(ivB)}, key, unb64(ctB));
  return td.decode(pt);
}

const docsLocked = () => !S.docKey;

/* Anything reaching for a document comes through here. */
async function requireDocs(then){
  if (S.docKey) return true;

  if (bio.enrolled()){
    try {
      const pass = await bio.recover();
      await openDocs(pass);
      if (then) then();
      return true;
    } catch (e){
      toast(e.message || 'Face ID would not play along, sir.');
    }
  }
  sheetDocUnlock(then);
  return false;
}

async function openDocs(passphrase){
  const meta = (await db.select('pa_meta', `user_id=eq.${uid()}&select=*`))[0];
  const master = await deriveKey(passphrase, meta.kdf_salt, meta.kdf_iters || CFG.kdfIters);
  const check = await decWith(master, meta.verifier).catch(() => null);
  if (check !== 'pa-vault-ok') throw new Error('That is not the passphrase, sir.');

  S.master = master;
  S.docKey = await keys.derive(master, 'documents');
  await migrateDocs();
  await loadDocs();
  renderVault();
  toast('Documents open, sir.');
}

function sheetDocUnlock(then){
  openSheet(
    '<h2>Documents</h2>' +
    '<p class="muted small">These sit behind a second key, sir.</p>' +
    (bio.enrolled() ? '<button class="btn" id="d-face">Face ID</button>' +
                      '<div style="height:1rem"></div>' +
                      '<p class="small muted">Or the passphrase:</p>' : '') +
    '<input id="d-pass" type="password" autocomplete="off" placeholder="Passphrase">' +
    '<div style="height:.8rem"></div>' +
    '<button class="btn" id="d-go">Open</button>' +
    '<div style="height:.6rem"></div>' +

  const run = async get => {

      closeSheet();
      if (then) setTimeout(then, 150);
    } catch (e){ toast(e.message || 'That did not work, sir.'); }

  if (bio.enrolled()) $('#d-face').onclick = () => run(() => bio.recover());
  $('#d-go').onclick = () => run(async () => $('#d-pass').value);

/* Documents sealed before the split are re-sealed with the document key
   the first time it is available. One row at a time, only marking a row
   done once its new ciphertext is safely stored. */
async function migrateDocs(){
  if (!S.master || !S.docKey) return;
  let rows;
  try {
    rows = await db.select('pa_documents', `user_id=eq.${uid()}&enc_v=eq.1&select=*`);
  } catch { return; }
  if (!rows.length) return;

  for (const r of rows){
    try {
      const payload = r.payload_enc ? await decWith(S.master, r.payload_enc) : null;
      const image   = r.image_enc   ? await decWith(S.master, r.image_enc)   : null;
      await db.update('pa_documents', r.id, {
        payload_enc: payload ? await encWith(S.docKey, payload) : null,
        image_enc:   image   ? await encWith(S.docKey, image)   : null,
        enc_v: 2
      });
    } catch { /* leave it at v1 and try again next time */ }
  }
}

async function loadDocs(){
  if (!S.docKey){ S.docs = []; return; }
  const rows = await db.select('pa_documents',
    `user_id=eq.${uid()}&status=eq.active&select=*&order=expiry_date.asc`);
  for (const r of rows){
    const key = r.enc_v === 2 ? S.docKey : (S.master || S.key);
    try { r._ = JSON.parse(await decWith(key, r.payload_enc) || '{}'); }
    catch { r._ = {__error: true}; }
  }
  S.docs = rows;
}

  sync.stop();
