<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12161f">
<title>PA</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --ground:#12161f;
  --raised:#1b2230;
  --line:#2c3446;
  --paper:#e8e9ec;
  --muted:#8a93a6;
  --brass:#c8a25c;
  --alert:#d4614e;
  --ok:#6e9e7e;
  --serif: ui-serif, "New York", Iowan Old Style, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ground); color:var(--paper);
  font:400 16px/1.5 var(--sans);
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
h1{font-size:2rem;line-height:1.15}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:.4em 0;max-width:64ch}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--paper);background:var(--ground);
  border:1px solid var(--line);border-radius:8px;padding:.65em .8em;width:100%;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--brass);outline-offset:2px
}
label{display:block;margin:.9rem 0 .3rem;color:var(--muted);font-size:.85rem}
.row{display:flex;gap:.6rem}
.row>*{flex:1}
.btn{
  background:var(--brass);color:#20180a;font-weight:600;
  padding:.8em 1.1em;border-radius:10px;text-align:center;display:block;width:100%;
}
.btn.ghost{background:none;color:var(--paper);border:1px solid var(--line);font-weight:500}
.btn.danger{background:none;color:var(--alert);border:1px solid var(--alert)}
.chip{
  display:inline-block;font-size:.72rem;padding:.2em .55em;border-radius:5px;
  border:1px solid var(--line);color:var(--muted);vertical-align:2px
}
.chip.biz{border-color:var(--brass);color:var(--brass)}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------------------------------------------------------------- gate */
#gate{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:2rem 1.4rem calc(2rem + env(safe-area-inset-bottom));
}
#gate[hidden]{display:none}
#gate h1{margin-bottom:.2rem}
#gate .lede{color:var(--muted);margin-bottom:2rem}
.keyhole{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--brass);
  position:relative;margin-bottom:1.6rem
}
.keyhole::after{
  content:"";position:absolute;left:50%;top:11px;width:4px;height:20px;
  background:var(--brass);transform:translateX(-50%);border-radius:2px
}

/* ---------------------------------------------------------------- app */
#app[hidden]{display:none}
main{padding:calc(1rem + env(safe-area-inset-top)) 1.1rem 6.5rem}
section[hidden]{display:none}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.2rem}
.head .date{font-family:var(--serif);font-size:.95rem;color:var(--muted)}

/* brief hero */
.brief-hero{border-bottom:1px solid var(--line);padding-bottom:1.1rem;margin-bottom:1.2rem}
.brief-hero h1{margin-bottom:.35rem}
.weather{display:flex;align-items:center;gap:.55rem;color:var(--muted);font-size:.95rem}
.weather b{color:var(--paper);font-weight:600}
.flag{color:var(--brass);font-family:var(--serif);font-size:1.05rem;margin-top:.5rem}

/* list items carry urgency on the left rule */
.item{
  border-left:2px solid var(--line);padding:.65rem 0 .65rem .8rem;margin-bottom:.15rem;
  display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left
}
.item.due{border-left-color:var(--alert)}
.item.soon{border-left-color:var(--brass)}
.item.done{opacity:.45}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500}
.item .when{color:var(--muted);font-size:.85rem;white-space:nowrap}
.group{margin:1.6rem 0 .6rem;color:var(--muted);font-family:var(--serif);font-size:1rem}
.empty{color:var(--muted);padding:1.2rem 0;font-family:var(--serif)}

/* tabs */
#tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:rgba(18,22,31,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:.5rem .4rem calc(.5rem + env(safe-area-inset-bottom));
}
#tabs button{flex:1;padding:.45rem 0;color:var(--muted);font-size:.7rem;text-align:center}
#tabs button svg{display:block;margin:0 auto .2rem;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
#tabs button[aria-current="page"]{color:var(--brass)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(6,8,12,.6)}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;
  background:var(--raised);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:1.2rem 1.1rem calc(1.6rem + env(safe-area-inset-bottom));
}
#sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 1rem}
@media (prefers-reduced-motion:no-preference){
  #sheet.open .panel{animation:rise .22s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{transform:translateY(14px);opacity:.6}}
}
.docimg{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:.8rem 0}

/* ask */
.bubble{padding:.75rem .9rem;border-radius:12px;margin-bottom:.6rem;max-width:88%}
.bubble.me{background:var(--raised);margin-left:auto}
.bubble.pa{border:1px solid var(--line)}
.bubble.pa p:first-child{margin-top:0}
.askbar{
  position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));
  padding:.6rem .9rem;background:var(--ground);border-top:1px solid var(--line);
  display:flex;gap:.5rem;align-items:center
}
.mic{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:50%;font-size:1.1rem}
.mic.on{border-color:var(--alert);color:var(--alert)}

#toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);
  padding:.6rem 1rem;border-radius:10px;font-size:.9rem;z-index:30;display:none;max-width:88vw
}
#toast.show{display:block}
</style>
</head>
<body>

<!-- ============================================================== gate -->
<div id="gate">
  <div class="keyhole"></div>
  <h1>PA</h1>
  <p class="lede" id="gate-lede">Sign in, then unlock the vault.</p>

  <div id="step-signin">
    <label for="g-email">Email</label>
    <input id="g-email" type="email" autocomplete="username" inputmode="email">
    <label for="g-pw">Account password</label>
    <input id="g-pw" type="password" autocomplete="current-password">
    <div style="height:1.2rem"></div>
    <button class="btn" id="g-signin">Sign in</button>
  </div>

  <div id="step-unlock" hidden>
    <label for="g-pass">Vault passphrase</label>
    <input id="g-pass" type="password" autocomplete="off">
    <p class="small muted" id="g-hint">This never leaves the phone. Nobody can recover it for you.</p>
    <div style="height:.6rem"></div>
    <button class="btn" id="g-unlock">Unlock</button>
    <div style="height:.6rem"></div>
    <button class="btn ghost" id="g-out">Sign out</button>
  </div>
</div>

<!-- =============================================================== app -->
<div id="app" hidden>
<main>

  <section id="view-brief">
    <div class="brief-hero">
      <div class="date" id="b-date"></div>
      <h1 id="b-greet">Today</h1>
      <div class="weather" id="b-weather"><span class="muted">Checking the forecast…</span></div>
      <div class="flag" id="b-flag" hidden></div>
    </div>
    <div id="b-today"></div>
    <div id="b-ahead"></div>
  </section>

  <section id="view-vault" hidden>
    <div class="head"><h2>Vault</h2><button class="chip" id="v-add">Add document</button></div>
    <div id="v-list"></div>
  </section>

  <section id="view-cal" hidden>
    <div class="head"><h2>Calendar</h2><button class="chip" id="c-add">Add entry</button></div>
    <div id="c-list"></div>
  </section>

  <section id="view-people" hidden>
    <div class="head"><h2>People &amp; money</h2><button class="chip" id="p-add">Add</button></div>
    <div id="p-list"></div>
  </section>

  <section id="view-ask" hidden>
    <div class="head"><h2>Ask</h2><button class="chip" id="a-voice">Voice</button></div>
    <div id="a-thread"></div>
    <div style="height:4rem"></div>
  </section>

</main>

<div class="askbar" id="askbar" hidden>
  <input id="a-input" placeholder="What's on today?" enterkeyhint="send">
  <button class="mic" id="a-mic" aria-label="Speak">🎙</button>
</div>

<nav id="tabs">
  <button data-view="brief" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Today</button>
  <button data-view="vault">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="3"/></svg>Vault</button>
  <button data-view="cal">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-view="people">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.5 3.1-5.6 7-5.6s7 2.1 7 5.6"/></svg>People</button>
  <button data-view="ask">
    <svg viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/></svg>Ask</button>
</nav>
</div>

<div id="sheet"><div class="scrim"></div><div class="panel"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   PA — v1
   Static HTML/JS · Supabase REST · AES-GCM encrypted on device
   ===================================================================== */

const CFG = {
  // ---- FILL THESE IN (Supabase → Project Settings → API) -------------
  url:  'https://glimkvmtqdldbinumzwg.supabase.co',
  anon: 'sb_publishable_5NPBxxfv9duXIEcsnqGJ9g_aIuel95-',
  // --------------------------------------------------------------------
  askEndpoint: '/.netlify/functions/ask',   // web fallback, see README
  kdfIters: 600000
};

/* ------------------------------------------------------------- helpers */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

const DAY = 86400000;
const todayISO = () => new Date().toLocaleDateString('en-CA');       // YYYY-MM-DD, local
const parseISO = d => { const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd); };
const daysUntil = d => Math.round((parseISO(d) - parseISO(todayISO())) / DAY);

function prettyDate(d, opts){
  return parseISO(d).toLocaleDateString('en-GB',
    opts || {weekday:'short', day:'numeric', month:'short'});
}
function prettyWhen(iso, allDay){
  const dt = new Date(iso);
  const date = dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  if (allDay) return date;
  return date + ' ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
function relative(days){
  if (days < 0)  return Math.abs(days) + (Math.abs(days)===1?' day ago':' days ago');
  if (days === 0) return 'today';
  if (days === 1) return 'tomorrow';
  return 'in ' + days + ' days';
}

/* --------------------------------------------------------------- state */
const S = {
  session: null,      // supabase auth session
  key: null,          // CryptoKey, memory only
  docs: [], events: [], contacts: [], subs: [],
  weather: null, holiday: null,
  view: 'brief'
};

/* ---------------------------------------------------------------- auth */
const store = {
  get s(){ try { return JSON.parse(localStorage.getItem('pa.session')||'null'); } catch { return null; } },
  set s(v){ v ? localStorage.setItem('pa.session', JSON.stringify(v)) : localStorage.removeItem('pa.session'); }
};

async function signIn(email, password){
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=password`, {
    method:'POST',
    headers:{'apikey':CFG.anon,'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });
  if (!r.ok) throw new Error('Email or password not recognised.');
  const j = await r.json();
  j.expires_at = Date.now() + (j.expires_in - 60) * 1000;
  S.session = j; store.s = j;
  return j;
}

async function refresh(){
  const s = store.s; if (!s?.refresh_token) return null;
  const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST',
    headers:{'apikey':CFG.anon,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: s.refresh_token})
  });
  if (!r.ok){ store.s = null; return null; }
  const j = await r.json();
  j.expires_at = Date.now() + (j.expires_in - 60) * 1000;
  S.session = j; store.s = j;
  return j;
}

function signOut(){
  store.s = null; S.session = null; S.key = null;
  location.reload();
}

/* ------------------------------------------------------ supabase REST */
async function api(path, opts = {}){
  if (S.session && Date.now() > S.session.expires_at) await refresh();
  const r = await fetch(`${CFG.url}/rest/v1/${path}`, {
    ...opts,
    headers:{
      'apikey': CFG.anon,
      'Authorization': `Bearer ${S.session.access_token}`,
      'Content-Type': 'application/json',
      'Prefer': opts.method === 'POST' ? 'return=representation'
              : opts.method === 'PATCH' ? 'return=representation' : '',
      ...(opts.headers||{})
    }
  });
  if (!r.ok) throw new Error(await r.text());
  if (r.status === 204) return null;
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

const uid = () => S.session.user.id;

const db = {
  select: (t, q='') => api(`${t}?${q}`),
  insert: (t, row)   => api(t, {method:'POST', body: JSON.stringify({...row, user_id: uid()})}),
  update: (t, id, p) => api(`${t}?id=eq.${id}`, {method:'PATCH', body: JSON.stringify(p)}),
  remove: (t, id)    => api(`${t}?id=eq.${id}`, {method:'DELETE'})
};

/* ------------------------------------------------------------- crypto */
const te = new TextEncoder(), td = new TextDecoder();

function b64(buf){
  const b = new Uint8Array(buf); let s = '';
  for (let i=0;i<b.length;i+=8192) s += String.fromCharCode(...b.subarray(i,i+8192));
  return btoa(s);
}
function unb64(str){
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(pass, saltB64, iters){
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: unb64(saltB64), iterations: iters, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

async function encStr(plain){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, S.key, te.encode(plain));
  return b64(iv) + '.' + b64(ct);
}
async function decStr(blob){
  if (!blob) return null;
  const [ivB, ctB] = blob.split('.');
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(ivB)}, S.key, unb64(ctB));
  return td.decode(pt);
}
const encJSON = o => encStr(JSON.stringify(o));
async function decJSON(blob){
  try { const s = await decStr(blob); return s ? JSON.parse(s) : {}; }
  catch { return {__error:true}; }
}

/* First run: create salt + verifier. Later runs: check passphrase. */
async function openVault(pass){
  let meta = (await db.select('pa_meta', `user_id=eq.${uid()}&select=*`))[0];

  if (!meta){
    const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    S.key = await deriveKey(pass, salt, CFG.kdfIters);
    const verifier = await encStr('pa-vault-ok');
    meta = (await db.insert('pa_meta',
      {user_id: uid(), kdf_salt: salt, verifier, kdf_iters: CFG.kdfIters}))[0];
    return true;
  }

  S.key = await deriveKey(pass, meta.kdf_salt, meta.kdf_iters || CFG.kdfIters);
  try {
    if (await decStr(meta.verifier) !== 'pa-vault-ok') throw 0;
  } catch { S.key = null; throw new Error('That passphrase does not match this vault.'); }
  return false;
}

/* ------------------------------------------------------------- images */
/* Re-encoding through canvas resizes AND strips EXIF, so a document photo
   carries no GPS coordinates into the vault. */
function shrink(file, maxEdge = 1800, quality = .82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', quality).split(',')[1]);   // base64, no header
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read that image.')); };
    img.src = url;
  });
}

/* ---------------------------------------------------------------- MRZ */
/* The two chevron lines on a passport are designed to be machine read and
   carry check digits, so they are far more reliable than the printed
   fields. Paste or dictate them and every field fills itself. */
function parseMRZ(raw){
  const lines = raw.toUpperCase().split(/[\n\r]+/)
                   .map(l => l.replace(/\s+/g,''))      // OCR loves adding spaces
                   .filter(l => l.length > 25 && /^[A-Z0-9<]+$/.test(l));
  const l2 = lines.find(l => /^[A-Z0-9<]{40,44}$/.test(l) && /\d{6}/.test(l.slice(13,19)));
  if (!l2) return null;
  const yy = +l2.slice(21,23), mm = l2.slice(23,25), dd = l2.slice(25,27);
  if (!/^\d{2}$/.test(mm) || !/^\d{2}$/.test(dd)) return null;
  const year = 2000 + yy;                       // expiry is always future-dated
  const l1 = lines.find(l => l.startsWith('P<')) || '';
  const names = l1.slice(5).split('<<');
  return {
    number: l2.slice(0,9).replace(/</g,''),
    expiry: `${year}-${mm}-${dd}`,
    holder: names.length > 1
      ? (names[1].replace(/</g,' ').trim() + ' ' + names[0].replace(/</g,' ').trim()).trim()
      : ''
  };
}

/* -------------------------------------------------------------- voice */
const voice = {
  list: [], chosen: localStorage.getItem('pa.voice') || '',
  load(){
    this.list = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    if (!this.chosen && this.list.length) this.chosen = this.list[0].name;
  },
  speak(text){
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
    const v = this.list.find(x => x.name === this.chosen);
    if (v) u.voice = v;
    u.rate = 1; u.pitch = 1;
    speechSynthesis.speak(u);
  },
  set(name){ this.chosen = name; localStorage.setItem('pa.voice', name); }
};
if ('speechSynthesis' in window){
  voice.load();
  speechSynthesis.onvoiceschanged = () => voice.load();
}

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(onText){
  if (!Rec){ toast('This browser will not do speech input. Type instead.'); return; }
  const btn = $('#a-mic');
  if (rec){ rec.stop(); rec = null; btn.classList.remove('on'); return; }
  rec = new Rec();
  rec.lang = 'en-GB'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => onText(e.results[0][0].transcript);
  rec.onend = () => { rec = null; btn.classList.remove('on'); };
  rec.onerror = () => { toast('Did not catch that.'); };
  btn.classList.add('on');
  rec.start();
}

/* ---------------------------------------------------------- load data */
async function loadAll(){
  const q = `user_id=eq.${uid()}&select=*`;
  const [docs, events, contacts, subs] = await Promise.all([
    db.select('pa_documents',     q + '&status=eq.active&order=expiry_date.asc'),
    db.select('pa_events',        q + '&order=starts_at.asc'),
    db.select('pa_contacts',      q),
    db.select('pa_subscriptions', q + '&cancelled=eq.false')
  ]);
  const open = async rows => { for (const r of rows) r._ = await decJSON(r.payload_enc); return rows; };
  S.docs     = await open(docs);
  S.events   = await open(events);
  S.contacts = await open(contacts);
  S.subs     = await open(subs);
}

/* -------------------------------------------------- weather & holidays */
async function loadContext(){
  try {
    const hol = await fetch('https://www.gov.uk/bank-holidays.json').then(r => r.json());
    const t = todayISO();
    const list = hol['england-and-wales'].events;
    S.holiday = list.find(e => e.date === t) || null;
    S.nextHol = list.find(e => e.date > t) || null;
  } catch { /* CORS or offline: see README for the proxy */ }

  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    const la = pos.coords.latitude.toFixed(3), lo = pos.coords.longitude.toFixed(3);
    try {
      const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + la + '&longitude=' + lo +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&forecast_days=6&timezone=auto';
      S.weather = await fetch(u).then(r => r.json());
      renderBrief();
    } catch {}
  }, () => {}, {maximumAge: 1800000, timeout: 8000});
}

const WX = {0:'clear',1:'mostly clear',2:'some cloud',3:'overcast',45:'fog',48:'freezing fog',
  51:'light drizzle',53:'drizzle',55:'heavy drizzle',61:'light rain',63:'rain',65:'heavy rain',
  71:'light snow',73:'snow',75:'heavy snow',80:'showers',81:'showers',82:'heavy showers',
  95:'thunderstorms',96:'thunderstorms',99:'thunderstorms'};

function weatherLine(i){
  i = i || 0;
  const d = S.weather && S.weather.daily;
  if (!d) return null;
  return {
    text: WX[d.weather_code[i]] || 'mixed',
    hi: Math.round(d.temperature_2m_max[i]),
    lo: Math.round(d.temperature_2m_min[i]),
    rain: d.precipitation_probability_max[i]
  };
}

/* -------------------------------------------------------- what is due */
function docDue(d){
  const date = d.notice_date || d.expiry_date;
  if (!date) return null;
  return {date: date, days: daysUntil(date), isNotice: !!d.notice_date};
}

function upcoming(days){
  days = days || 5;
  const out = [];
  const t = parseISO(todayISO());

  for (const e of S.events){
    if (e.done || !e.starts_at) continue;
    const when = new Date(e.starts_at);
    if (e.recurs === 'yearly'){
      when.setFullYear(t.getFullYear());
      if (when < t) when.setFullYear(t.getFullYear() + 1);
    }
    const dd = daysUntil(when.toLocaleDateString('en-CA'));
    if (dd >= 0 && dd <= days)
      out.push({days: dd, title: e._.title, kind: e.kind, tag: e.owner_tag,
                important: e.important, when: when.toISOString(), allDay: e.all_day, ref: e});
  }

  for (const d of S.docs){
    const due = docDue(d);
    if (!due) continue;
    const inWarning = due.days <= d.lead_days;
    if (due.days >= 0 && (due.days <= days || inWarning))
      out.push({days: due.days, kind: 'document', tag: d.owner_tag, important: true,
                title: (d._.label || d.doc_type) + (due.isNotice ? ' notice deadline' : ' expires'),
                ref: d});
  }

  for (const s of S.subs){
    if (!s.next_charge) continue;
    const dd = daysUntil(s.next_charge);
    if (dd >= 0 && dd <= days)
      out.push({days: dd, kind: 'subscription', tag: s.owner_tag,
                title: s._.name + ' renews' + (s._.amount ? ' \u2014 \u00a3' + s._.amount : ''),
                ref: s});
  }

  return out.sort((a, b) => a.days - b.days);
}

/* ---------------------------------------------------------- rendering */
function itemRow(o){
  const cls = o.days === 0 ? 'due' : o.days <= 2 ? 'soon' : '';
  const tag = o.tag === 'business' ? '<span class="chip biz">business</span>' : '';
  const when = (o.days === 0 && o.when && !o.allDay)
    ? new Date(o.when).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
    : relative(o.days);
  return '<button class="item ' + cls + '" data-open="' + (o.ref ? o.ref.id : '') +
    '" data-kind="' + o.kind + '"><span class="t"><b>' + esc(o.title) +
    '</b><span class="small muted">' + esc(o.kind) + '</span> ' + tag +
    '</span><span class="when">' + when + '</span></button>';
}

function renderBrief(){
  const now = new Date();
  $('#b-date').textContent = now.toLocaleDateString('en-GB',
    {weekday:'long', day:'numeric', month:'long'});
  const h = now.getHours();
  $('#b-greet').textContent = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';

  const w = weatherLine(0);
  $('#b-weather').innerHTML = w
    ? '<span><b>' + w.hi + '\u00b0</b> / ' + w.lo + '\u00b0 &nbsp;' + esc(w.text) +
      (w.rain >= 30 ? ' \u00b7 ' + w.rain + '% rain' : '') + '</span>'
    : '<span class="muted">No forecast \u2014 location is off.</span>';

  const flag = $('#b-flag');
  if (S.holiday){
    flag.hidden = false;
    flag.textContent = 'Bank holiday \u2014 ' + S.holiday.title + '.';
  } else if (S.nextHol && daysUntil(S.nextHol.date) <= 7){
    flag.hidden = false;
    flag.textContent = S.nextHol.title + ' ' + relative(daysUntil(S.nextHol.date)) + '.';
  } else flag.hidden = true;

  const all = upcoming(5);
  const today = all.filter(o => o.days === 0);
  const ahead = all.filter(o => o.days > 0);

  $('#b-today').innerHTML = today.length
    ? '<div class="group">On today</div>' + today.map(itemRow).join('')
    : '<div class="empty">Nothing booked today.</div>';
  $('#b-ahead').innerHTML = ahead.length
    ? '<div class="group">Next five days</div>' + ahead.map(itemRow).join('')
    : '';
}

function renderVault(){
  if (!S.docs.length){
    $('#v-list').innerHTML =
      '<div class="empty">Nothing stored yet. Add a passport, licence or contract.</div>';
    return;
  }
  const groups = {personal: [], business: []};
  for (const d of S.docs) groups[d.owner_tag].push(d);

  $('#v-list').innerHTML = Object.keys(groups).filter(k => groups[k].length).map(k =>
    '<div class="group">' + (k === 'business' ? 'Business' : 'Personal') + '</div>' +
    groups[k].map(d => {
      const due = docDue(d);
      const cls = !due ? '' : due.days <= 0 ? 'due' : due.days <= d.lead_days ? 'soon' : '';
      return '<button class="item ' + cls + '" data-doc="' + d.id + '"><span class="t"><b>' +
        esc(d._.label || d.doc_type) + '</b><span class="small muted">' +
        (d.has_image ? 'photo held \u00b7 ' : '') + esc(d.doc_type.replace(/_/g, ' ')) +
        '</span></span><span class="when">' +
        (due ? prettyDate(due.date, {day:'numeric', month:'short', year:'2-digit'}) : '\u2014') +

  t.insertAdjacentHTML('beforeend', '<div class="bubble pa">' + html + '</div>');
  t.lastElementChild.scrollIntoView({block: 'end'});
  voice.speak(spoken || t.lastElementChild.textContent);
}
function heard(text){
  $('#a-thread').insertAdjacentHTML('beforeend',
    '<div class="bubble me">' + esc(text) + '</div>');
}

function briefSentence(days){
  const list = upcoming(days);
  const today = list.filter(o => o.days === 0);
  const ahead = list.filter(o => o.days > 0);
  const w = weatherLine(0);
  let out = '';

  if (S.holiday) out += 'Today is a bank holiday, ' + S.holiday.title + '. ';
  if (w) out += 'The forecast is ' + w.text + ', up to ' + w.hi + ' degrees' +
    (w.rain >= 30 ? ', with a ' + w.rain + ' percent chance of rain' : '') + '. ';

  out += today.length
    ? 'On today: ' + today.map(o => o.title).join('; ') + '. '
    : 'Nothing is booked for today. ';

  if (ahead.length)
    out += 'Coming up: ' + ahead.map(o => o.title + ' ' + relative(o.days)).join('; ') + '.';

  return out;
}

async function askWeb(q){
  try {
    const r = await fetch(CFG.askEndpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    if (!r.ok) throw new Error('no endpoint');
    const j = await r.json();
    return j.answer;
  } catch {
    return null;
  }
}

async function ask(q){
  const t = q.toLowerCase().trim();
  heard(q);

  if (/what.*(on|happening).*(today)|^today$|brief/.test(t))
    return say(esc(briefSentence(5)).replace(/\. /g, '.<br>'), briefSentence(5));

  if (/next (5|five) days|coming up|this week|ahead/.test(t)){
    const a = upcoming(7).filter(o => o.days > 0);
    const line = a.length
      ? 'Over the next week: ' + a.map(o => o.title + ' ' + relative(o.days)).join('; ') + '.'
      : 'Nothing in the next week.';
    return say(esc(line), line);
  }

  if (/weather|forecast|rain/.test(t)){
    const w = weatherLine(0);
    const line = w ? 'Today: ' + w.text + ', ' + w.lo + ' to ' + w.hi + ' degrees, ' +
      w.rain + ' percent chance of rain.' : 'No forecast. Location is switched off.';
    return say(esc(line), line);
  }

  if (/expire|expiry|renew|when does/.test(t)){
    const hits = S.docs.filter(d => d.expiry_date || d.notice_date)
      .filter(d => t.split(/\s+/).some(w => w.length > 3 &&
        ((d._.label || '') + ' ' + d.doc_type).toLowerCase().includes(w)));
    const set = hits.length ? hits : S.docs.filter(d => d.expiry_date);
    if (!set.length) return say('Nothing in the vault has an expiry date on it yet.');
    const line = set.map(d => {
      const due = docDue(d);
      return (d._.label || d.doc_type) + ' ' + (due.isNotice ? 'needs notice by ' : 'expires ') +
        prettyDate(due.date, {day:'numeric', month:'long', year:'numeric'}) + ', ' + relative(due.days);
    }).join('. ') + '.';
    return say(esc(line), line);
  }

  if (/show (me )?(my )?/.test(t)){
    const hit = S.docs.find(d => t.includes((d._.label || '').toLowerCase().split(' ')[0]) ||
      t.includes(d.doc_type.replace(/_/g, ' ')));
    if (hit){
      say('Opening ' + esc(hit._.label || hit.doc_type) + '.', 'Opening it now.');
      return sheetViewDoc(hit.id);
    }
  }

  if (/subscription|paying for|direct debit/.test(t)){
    if (!S.subs.length) return say('No subscriptions logged yet.');
    const monthly = S.subs.reduce((n, s) => n +
      (+s._.amount || 0) * ({weekly:4.33, monthly:1, quarterly:1/3, yearly:1/12}[s.cycle] || 1), 0);
    const line = S.subs.map(s => s._.name + ', £' + (s._.amount || '?') + ' ' + s.cycle).join('. ') +
      '. That is about £' + monthly.toFixed(2) + ' a month.';
    return say(esc(line), line);
  }

  if (/birthday/.test(t)){
    const b = upcoming(365).filter(o => o.kind === 'birthday').slice(0, 5);
    const line = b.length ? b.map(o => o.title + ' ' + relative(o.days)).join('. ') + '.'
                          : 'No birthdays saved.';
    return say(esc(line), line);
  }

  if (/^(add|note|remind)/.test(t)){
    const title = q.replace(/^(add|note|remind me to|remind me)\s*/i, '').trim();
    say('Opening a new entry.', 'Opening a new entry.');
    return sheetAddEvent({title: title, kind: /remind/.test(t) ? 'reminder' : 'note'});
  }

  const web = await askWeb(q);
  if (web) return say(esc(web).replace(/\n/g, '<br>'), web);
  say('I have nothing on that in the vault, and the web search is not connected yet. ' +
      'See the README for the search function.');
}

/* ------------------------------------------------------------- alerts */
let alertTimers = [];
function scheduleAlerts(){
  alertTimers.forEach(clearTimeout);
  alertTimers = [];
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  for (const e of S.events){
    if (e.done || !e.starts_at) continue;
    for (const a of (e.alerts || [])){
      const at = new Date(e.starts_at).getTime() - a.minutes_before * 60000;
      if (at > now && at - now < 6 * 3600000){
        alertTimers.push(setTimeout(() => {
          new Notification(e._.title, {body: prettyWhen(e.starts_at, e.all_day)});
          voice.speak(e._.title + ', ' + prettyWhen(e.starts_at, e.all_day));
        }, at - now));
      }
    }
  }
}

/* --------------------------------------------------------------- wire */
function show(view){
  S.view = view;
  ['brief','vault','cal','people','ask'].forEach(v =>
    $('#view-' + v).hidden = v !== view);
  $$('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  $('#askbar').hidden = view !== 'ask';
  window.scrollTo(0, 0);
}

$$('#tabs button').forEach(b => b.onclick = () => show(b.dataset.view));
$('#v-add').onclick = () => sheetAddDoc();
$('#c-add').onclick = () => sheetAddEvent();
$('#p-add').onclick = () => sheetAddPerson();

document.addEventListener('click', e => {
  const b = e.target.closest('[data-doc],[data-evt],[data-open]');
  if (!b) return;
  const id = b.dataset.doc || b.dataset.evt || b.dataset.open;
  if (b.dataset.doc || b.dataset.kind === 'document') return sheetViewDoc(id);
  if (b.dataset.evt || ['note','appointment','reminder','birthday'].includes(b.dataset.kind))
    return sheetViewEvent(id);
});

$('#a-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  e.target.value = '';
  ask(v);
});
$('#a-mic').onclick = () => listen(text => ask(text));

$('#a-voice').onclick = () => {
  voice.load();
  openSheet('<h2>Voice</h2><label for="f-voice">Which voice reads answers out</label>' +
    '<select id="f-voice">' + voice.list.map(v =>
      '<option value="' + esc(v.name) + '"' + (v.name === voice.chosen ? ' selected' : '') + '>' +
      esc(v.name) + ' (' + v.lang + ')</option>').join('') + '</select>' +
    '<div style="height:.8rem"></div>' +
    '<button class="btn ghost" id="f-try">Hear it</button>' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn" onclick="closeSheet()">Done</button>');
  $('#f-voice').onchange = e => voice.set(e.target.value);
  $('#f-try').onclick = () => voice.speak(briefSentence(5) || 'This is how I will read things to you.');
};

/* ---------------------------------------------------------------- gate */
$('#g-signin').onclick = async () => {
  const btn = $('#g-signin');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await signIn($('#g-email').value.trim(), $('#g-pw').value);
    toUnlock();
  } catch (err){
    toast(err.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};

function toUnlock(){
  $('#step-signin').hidden = true;
  $('#step-unlock').hidden = false;
  $('#gate-lede').textContent = 'Unlock the vault.';
  setTimeout(() => $('#g-pass').focus(), 100);
}

$('#g-out').onclick = signOut;

$('#g-unlock').onclick = async () => {
  const btn = $('#g-unlock'), pass = $('#g-pass').value;
  if (pass.length < 8){ toast('Use at least 8 characters.'); return; }
  btn.disabled = true; btn.textContent = 'Deriving key…';
  try {
    const isNew = await openVault(pass);
    $('#g-pass').value = '';
    btn.disabled = false; btn.textContent = 'Unlock';
    $('#gate').hidden = true;
    $('#app').hidden = false;
    await loadAll();
    renderAll();
    show('brief');
    loadContext();
    if ('Notification' in window && Notification.permission === 'default')
      Notification.requestPermission().then(scheduleAlerts);
    else scheduleAlerts();
    if (isNew) toast('Vault created. Write that passphrase down somewhere safe.');
  } catch (err){
    toast(err.message);
    btn.disabled = false; btn.textContent = 'Unlock';
  }
};

/* --------------------------------------------------------------- boot */
(async function boot(){
  if (CFG.url.includes('YOUR-PROJECT')){
    $('#gate-lede').textContent = 'Add your Supabase URL and anon key at the top of index.html.';
    return;
  }
  const s = store.s;
  if (s){
    S.session = s;
    if (Date.now() > s.expires_at) await refresh();
    if (S.session) toUnlock();
  }
})();
</script>
