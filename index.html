async function openWith(passphrase){
  const isNew = await openVault(passphrase);
  closeSheet();
  await loadAll();
  await mem.load();
  renderAll();
  scheduleAlerts();
  spokenBrief = false;
  speakBriefOnce();
  autolock.touch();
  if (isNew) toast('Vault created, sir. Write that passphrase down. I am entirely serious.');
  const next = afterUnlock; afterUnlock = null;
  if (next) setTimeout(next, 200);
}

/* ---------------------------------------------------------- auto-lock */
/* Idle timer while you're in the app, plus a short grace period when you
   leave it — long enough for a WhatsApp round trip, short enough that a
   pocketed phone shuts itself. Closing the app loses the key outright:
   it only ever lives in memory. */
const autolock = {
  mins: +(localStorage.getItem('pa.autolock') || 5),   // 0 = never
  idle: null, away: null,

  set(m){
    this.mins = m;
    localStorage.setItem('pa.autolock', String(m));
    this.touch();
  },

  touch(){
    clearTimeout(this.idle);
    if (locked() || !this.mins) return;
    this.idle = setTimeout(() => {
      if (!locked()){ relock(); voice.speak('Vault shut, sir. It had been a while.'); }
    }, this.mins * 60000);
  },

  left(){
    clearTimeout(this.away);
    if (locked() || !this.mins) return;
    this.away = setTimeout(() => { if (!locked()) relock(); }, 90000);
  },

  back(){ clearTimeout(this.away); this.touch(); }
};

['touchstart','click','keydown'].forEach(ev =>
  document.addEventListener(ev, () => autolock.touch(), {passive: true}));

/* --------------------------------------------------------- wake word */
/* Safari hands out recognition in short bursts, so "always listening"
   means restarting the moment each one ends. There's a hair of deafness
   between sessions — occasionally you'll have to say it twice. When the
   phone locks, iOS takes the microphone back; unlocking tries to grab it
   again, and offers a tap if it's refused. */
const wake = {
  on: localStorage.getItem('pa.wake') === 'on',
  word: (localStorage.getItem('pa.wakeword') || 'jarvis').toLowerCase(),
  rec: null, running: false, awake: false, sleepTimer: null,

  set(on){
    this.on = on;
    localStorage.setItem('pa.wake', on ? 'on' : 'off');
    on ? this.start() : this.stop();
  },
  setWord(w){
    this.word = (w || 'jarvis').trim().toLowerCase();
    localStorage.setItem('pa.wakeword', this.word);
  },

  start(){
    if (!Rec || !this.on || this.running || rec) return;   // never fight the tap-to-talk mic
    try {
      this.rec = new Rec();
      this.rec.lang = 'en-GB';
      this.rec.continuous = true;
      this.rec.interimResults = true;
      this.rec.onresult = e => this.heard(e);
      this.rec.onerror = ev => {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
          this.running = false; this.needsTap(); return;
        }
      };
      this.rec.onend = () => {
        this.running = false;
        if (this.on && !rec) setTimeout(() => this.start(), 250);
      };
      this.rec.start();
      this.running = true;
      this.badge(true);
    } catch { this.running = false; }
  },

  stop(){
    this.on = false; this.running = false; this.awake = false;
    try { this.rec && this.rec.stop(); } catch {}
    this.rec = null;
    this.badge(false);
  },

  pause(){ this.running = false; try { this.rec && this.rec.stop(); } catch {} this.rec = null; },
  resume(){ if (this.on) setTimeout(() => this.start(), 300); },

  heard(e){
    const last = e.results[e.results.length - 1];
    if (!last.isFinal) return;
    const text = last[0].transcript.trim();
    if (!text) return;

    if (!this.awake){
      const lower = text.toLowerCase();
      const i = lower.indexOf(this.word);
      if (i === -1) return;                 // discarded here, never sent anywhere
      const after = text.slice(i + this.word.length).replace(/^[\s,.:;-]+/, '');
      this.rouse(after);
      return;
    }

    clearTimeout(this.sleepTimer);
    this.sleepTimer = setTimeout(() => this.doze(), 25000);
    if (compose.active) compose.handle(text);
    else { this.doze(); ask(text); }
  },

  rouse(rest){
    this.awake = true;
    this.badge(true);
    clearTimeout(this.sleepTimer);
    this.sleepTimer = setTimeout(() => this.doze(), 25000);
    if (rest && rest.split(/\s+/).length > 1){
      if (compose.looksLikeMessage(rest)) return compose.begin(rest);
      return ask(rest);
    }
    voice.speak(pick(['Sir?', 'Yes, sir.', 'At your service.', 'Listening, sir.']));
  },

  doze(){
    this.awake = false;
    clearTimeout(this.sleepTimer);
    this.badge(true);
  },

  needsTap(){
    const b = $('#wake-bar');
    b.hidden = false;
    b.onclick = () => { b.hidden = true; this.start(); };
  },

  badge(){
    const el = $('#wake-dot');
    if (!el) return;
    el.hidden = !this.on;
    el.textContent = this.awake ? '● listening' : '○ ' + this.word;
  }
};

/* iOS releases the mic on lock or app switch. Try to take it back. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    autolock.back();
    if (wake.on) { wake.pause(); wake.resume(); }
  } else {
    autolock.left();
    wake.pause();
  }
});

/* ------------------------------------------------------------ compose */
/* Fills in WhatsApp, Messages or Mail and hands it to you. iOS will not
   let any app press send in another app, so the last tap is always yours. */
const READY = [
  'That is all ready for you to send, sir.',
  'Ready and waiting, sir. Yours to send.',
  'Written and loaded, sir. The send button is your department.',
  'There you are, sir. One tap and it is gone.',
  'All set, sir. I will leave the sending to you.',
  'Done, sir. Read it back before you send it, if you have any sense.'
];

function intlNumber(raw){
  let n = String(raw || '').replace(/[^\d+]/g, '');
  if (n.startsWith('+'))  return n.slice(1);
  if (n.startsWith('00')) return n.slice(2);
  if (n.startsWith('0'))  return '44' + n.slice(1);     // UK unless told otherwise
  return n;
}

const compose = {
  active: false, channel: null, to: null, contact: null,
  subject: null, body: null, awaiting: null, nudge: null, options: null,

  reset(){
    clearTimeout(this.nudge);
    Object.assign(this, {active:false, channel:null, to:null, contact:null,
      subject:null, body:null, awaiting:null, nudge:null, options:null});
  },

  looksLikeMessage(t){
    if (!this.channelOf(t)) return false;
    return /\b(send|write|message|text|email|tell\w*|say|drop|shoot|fire)\b/i.test(t) ||
           /^\s*(whats ?app|text|email|sms|message)\b/i.test(t);
  },

  channelOf(t){
    if (/\bwhats ?app\b/i.test(t)) return 'whatsapp';
    if (/\be ?mail\b/i.test(t))    return 'email';
    if (/\b(text|sms|message)\b/i.test(t)) return 'sms';
    return null;
  },

  /* "to Dave" is ambiguous — "I want to send" has a "to" in it as well.
     Scan every "to" and keep the last candidate that isn't swallowing a verb. */
  recipientIn(t){
    const stop = /\b(send|write|whats ?app|e ?mail|text|sms|message|want|like|going|need)\b/i;
    const tail = '(?=\\s+(saying|telling|that says|that|about|regarding|with|and\\s+say|and\\s+tell)\\b|[,.!?]|$)';
    const name = "((?:the\\s+)?[a-z][a-z'\\- ]{1,28}?)";
    let found = null;

    const re = /\bto\s+/gi;
    let m;
    while ((m = re.exec(t)) !== null){
      const rest = t.slice(m.index + m[0].length);
      const hit = rest.match(new RegExp('^' + name + tail, 'i'));
      if (hit && !stop.test(hit[1])) found = hit[1].trim();
      re.lastIndex = m.index + m[0].length;   // don't skip later "to"s
    }
    if (found) return found;

    // "whatsapp mum telling her..." / "email the accountant about..."
    const direct = t.match(new RegExp(
      '(?:whats ?app|e ?mail|text|sms|message)\\s+(?!to\\b)' + name + tail, 'i'));
    if (direct && !stop.test(direct[1])) return direct[1].trim();
    return null;
  },

  begin(utterance){
    this.reset();
    this.active = true;
    this.channel = this.channelOf(utterance);
    this.to = this.recipientIn(utterance);

    const body = utterance.match(/\b(?:saying|telling (?:him|her|them)|that says|and say|and tell (?:him|her|them))\s+(.+)$/i);
    if (body) this.body = body[1].trim().replace(/[.]$/, '');

    if (this.channel === 'email'){
      const subj = utterance.match(/\b(?:about|regarding|re)\s+(.+?)(?=\s+(saying|and say)\b|[,.!?]|$)/i);
      if (subj) this.subject = subj[1].trim();
    }

    this.next();
  },

  say(line){
    say(esc(line), line);
    clearTimeout(this.nudge);
    this.nudge = setTimeout(() => {
      if (this.active && this.awaiting)
        voice.speak(pick(['Whenever you are ready, sir.',
                          'Still with you, sir.',
                          'Take your time. I am listening.']));
    }, 9000);
  },

  next(){
    if (!this.channel){
      this.awaiting = 'channel';
      return this.say('WhatsApp, text or email, sir?');
    }
    if (!this.to){
      this.awaiting = 'to';
      return this.say('Who am I sending it to?');
    }
    if (!this.contact && !this.resolve()) return;
    if (this.channel === 'email' && !this.subject){
      this.awaiting = 'subject';
      return this.say('What shall I put as the subject?');
    }
    if (!this.body){
      this.awaiting = 'body';
      return this.say(pick(['And what would you like it to say?',
                            'Go ahead, sir. I am taking it down.',
                            'What am I writing?']));
    }
    this.finish();
  },

  /* Match against the contacts already in the vault. */
  resolve(){
    const want = this.to.toLowerCase().trim();
    const needsEmail = this.channel === 'email';
    const usable = S.contacts.filter(c => needsEmail ? c._.email : c._.phone);
    let hits = usable.filter(c => (c._.name || '').toLowerCase().includes(want));
    if (!hits.length)
      hits = usable.filter(c => want.split(/\s+/)
        .some(w => w.length > 2 && (c._.name || '').toLowerCase().includes(w)));

    if (hits.length === 1){ this.contact = hits[0]; return true; }

    if (hits.length > 1){
      this.options = hits;
      this.awaiting = 'which';
      this.say('You have ' + hits.length + ' of those, sir. ' +
        hits.map(c => c._.name + (c._.relationship ? ', the ' + c._.relationship : ''))
            .join('; or ') + '. Which one?');
      return false;
    }

    this.awaiting = 'detail';
    this.say('I have no ' + (needsEmail ? 'email address' : 'number') +
      ' for ' + this.to + ', sir. Give it to me and I will use it this once.');
    return false;
  },

  handle(text){
    const t = text.trim();
    if (!t) return;
    clearTimeout(this.nudge);
    if (/^(cancel|stop|forget it|never mind)\b/i.test(t)){
      this.reset();
      return say('Dropped, sir.', 'Dropped, sir.');
    }
    heard(t);

    switch (this.awaiting){
      case 'channel': this.channel = this.channelOf(t) || null; break;
      case 'to':      this.to = t.replace(/^(to\s+)?/i, '').replace(/[.,]$/, ''); break;
      case 'which': {
        const m = this.options.find(c =>
          (c._.name || '').toLowerCase().includes(t.toLowerCase().split(/\s+/)[0]) ||
          (c._.relationship || '').toLowerCase().includes(t.toLowerCase()));
        if (m) this.contact = m;
        break;
      }
      case 'detail': {
        const val = t.replace(/\s+/g, '');
        this.contact = {_: this.channel === 'email' ? {name: this.to, email: val}
                                                    : {name: this.to, phone: val}};
        break;
      }
      case 'subject': this.subject = t.replace(/[.]$/, ''); break;
      case 'body':    this.body = t; break;
    }
    this.awaiting = null;
    this.next();
  },

  finish(){
    const c = this.contact._;
    let url;

    if (this.channel === 'whatsapp'){
      url = 'https://wa.me/' + intlNumber(c.phone) + '?text=' + encodeURIComponent(this.body);
    } else if (this.channel === 'sms'){
      url = 'sms:' + (c.phone || '').replace(/\s/g, '') +
            '&body=' + encodeURIComponent(this.body);
    } else {
      url = 'mailto:' + c.email +
            '?subject=' + encodeURIComponent(this.subject || '') +
            '&body=' + encodeURIComponent(this.body);
    }

    const line = pick(READY);
    say('<b>' + esc(c.name) + '</b><br>' +
        (this.subject ? esc(this.subject) + '<br>' : '') +
        '<span class="muted">' + esc(this.body) + '</span><br><br>' + esc(line), line);

    const target = this.channel;
    this.reset();
    wake.pause();
    setTimeout(() => {
      if (target === 'whatsapp') window.open(url, '_blank');
      else location.href = url;
    }, 1400);      // let it finish speaking before the app switch
  }
};

/* ------------------------------------------------------------- alerts */
let alertTimers = [];
function scheduleAlerts(){
  alertTimers.forEach(clearTimeout);
  alertTimers = [];
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  for (const e of S.events){
    if (e.done || !e.starts_at) continue;
    for (const a of (e.alerts || [])){
      const at = new Date(e.starts_at).getTime() - a.minutes_before * 60000;
      if (at > now && at - now < 6 * 3600000){
        alertTimers.push(setTimeout(() => {
          new Notification(e._.title, {body: prettyWhen(e.starts_at, e.all_day)});
          voice.speak(e._.title + ', ' + prettyWhen(e.starts_at, e.all_day));
        }, at - now));
      }
    }
  }
}

/* --------------------------------------------------------------- wire */
function show(view){
  S.view = view;
  ['brief','vault','cal','people','ask'].forEach(v =>
    $('#view-' + v).hidden = v !== view);
  $$('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  $('#askbar').hidden = view !== 'ask';
  window.scrollTo(0, 0);
}

$$('#tabs button').forEach(b => b.onclick = () => show(b.dataset.view));
$('#a-face').onclick = () => face.show();
$('#face-x').onclick = () => face.hide();
$('#v-add').onclick = () => requireVault(() => sheetAddDoc()) && sheetAddDoc();
$('#c-add').onclick = () => requireVault(() => sheetAddEvent()) && sheetAddEvent();
$('#p-add').onclick = () => requireVault(() => sheetAddPerson()) && sheetAddPerson();

document.addEventListener('click', e => {
  const b = e.target.closest('[data-doc],[data-evt],[data-open]');
  if (!b) return;
  const id = b.dataset.doc || b.dataset.evt || b.dataset.open;
  if (b.dataset.doc || b.dataset.kind === 'document') return sheetViewDoc(id);
  if (b.dataset.evt || ['note','appointment','reminder','birthday'].includes(b.dataset.kind))
    return sheetViewEvent(id);
});

$('#a-input').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  e.target.value = '';
  ask(v);
});
$('#a-mic').onclick = () => listen(text => ask(text));

$('#a-mem').onclick = () => {
  const label = {fact:'Knows', preference:'How you like things',
                 thread:'Live threads', persona:'How it talks to you'};
  const order = ['persona','preference','fact','thread'];
  let html = '<h2>What it has learned</h2>';

  if (!mem.items.length){
    html += '<p class="muted">Nothing yet, sir. It picks things up as you talk.</p>';
  } else {
    for (const k of order){
      const set = mem.items.filter(m => m.kind === k);
      if (!set.length) continue;
      html += '<div class="group">' + label[k] + '</div>' + set.map(m =>
        '<div class="item" style="border-left-color:' +
          (m.weight === 3 ? 'var(--brass)' : 'var(--line)') + '">' +
        '<span class="t">' + esc(m._.text) +
        (m.times_seen > 1 ? '<span class="small muted">seen ' + m.times_seen + ' times</span>' : '') +
        '</span><button class="chip" data-forget="' + m.id + '">Forget</button></div>').join('');
    }
  }

  html += '<div style="height:1.2rem"></div>' +
    '<button class="btn danger" id="m-wipe">Forget everything</button>' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn ghost" onclick="closeSheet()">Close</button>';
  openSheet(html);

  $$('[data-forget]').forEach(b => b.onclick = async () => {
    await mem.forget(b.dataset.forget);
    toast('Forgotten, sir.');
    $('#a-mem').onclick();
  });

  $('#m-wipe').onclick = async () => {
    if (!confirm('Wipe everything it has learned about you? This cannot be undone.')) return;
    await mem.forgetAll();
    closeSheet();
    toast('A clean slate, sir.');
  };
};

$('#a-voice').onclick = () => {
  voice.load();
  openSheet('<h2>Voice</h2>' +
    '<label><input type="checkbox" id="f-remote" style="width:auto;margin-right:.5rem"' +
      (voice.remote ? ' checked' : '') + '>Use ElevenLabs (needs a paid key)</label>' +
    '<p class="small muted">Off by default. Add the keys in Netlify, switch this ' +
      'on, and it upgrades with no rebuild. Falls back on its own if the key ' +
      'or the connection gives out.</p>' +
    '<label for="f-voice">Voice</label>' +
    '<select id="f-voice">' + voice.list.map(v =>
      '<option value="' + esc(v.name) + '"' + (v.name === voice.chosen ? ' selected' : '') + '>' +
      esc(v.name) + ' (' + v.lang + ')</option>').join('') + '</select>' +
    '<p class="small muted">On the iPhone, download Daniel (Premium) under Settings, ' +
      'Accessibility, Spoken Content, Voices. The compact one is dreadful.</p>' +
    '<div style="height:.8rem"></div>' +
    '<label><input type="checkbox" id="f-wake" style="width:auto;margin-right:.5rem"' +
      (wake.on ? ' checked' : '') + '>Listen for a wake word while open</label>' +
    '<input id="f-word" value="' + esc(wake.word) + '" placeholder="jarvis">' +
    '<p class="small muted">Only works while the app is on screen, and it will ' +
      'drink your battery. Everything not matching the wake word is discarded on ' +
      'the phone and never sent anywhere.</p>' +
    '<div style="height:.8rem"></div>' +
    '<button class="btn ghost" id="f-try">Let me hear it</button>' +
    '<div style="height:1.4rem"></div>' +
    '<div class="group">The vault</div>' +
    (locked()
      ? '<button class="btn" id="f-open">Open the vault</button>'
      : '<button class="btn ghost" id="f-face">' +
          (bio.enrolled() ? 'Forget Face ID' : 'Unlock with Face ID in future') + '</button>' +
        '<div style="height:.6rem"></div>' +
        '<button class="btn ghost" id="f-lock">Shut the vault now</button>') +
    '<label><input type="checkbox" id="f-faceauto" style="width:auto;margin-right:.5rem"' +
      (face.auto ? ' checked' : '') + '>Show the face whenever it speaks</label>' +
    '<div style="height:.8rem"></div>' +
    '<label for="f-auto">Shut the vault after</label>' +
    '<select id="f-auto">' +
      [[1,'1 minute'],[5,'5 minutes'],[15,'15 minutes'],[60,'an hour'],[0,'never']]
        .map(o => '<option value="' + o[0] + '"' +
          (autolock.mins === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
    '</select>' +
    '<p class="small muted">It also shuts if you leave the app for more than a ' +
      'minute and a half, and whenever the app is closed outright.</p>' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn danger" id="f-out">Sign out</button>' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn" onclick="closeSheet()">Done</button>');
  $('#f-voice').onchange = e => voice.set(e.target.value);
  $('#f-remote').onchange = e => voice.setRemote(e.target.checked);
  $('#f-wake').onchange = e => {
    wake.set(e.target.checked);
    toast(e.target.checked ? 'Listening, sir.' : 'Ears off, sir.');
  };
  $('#f-word').onchange = e => { wake.setWord(e.target.value); wake.badge(); };
  $('#f-auto').onchange = e => autolock.set(+e.target.value);
  $('#f-faceauto').onchange = e => {
    face.auto = e.target.checked;
    localStorage.setItem('pa.face', e.target.checked ? 'on' : 'off');
  };
  if ($('#f-open')) $('#f-open').onclick = () => sheetUnlock();
  if ($('#f-lock')) $('#f-lock').onclick = () => { closeSheet(); relock(); };
  if ($('#f-out'))  $('#f-out').onclick  = () => signOut();

  if ($('#f-face')) $('#f-face').onclick = async () => {
    if (bio.enrolled()){
      bio.forget();
      closeSheet();
      return toast('Face ID forgotten, sir. Passphrase from now on.');
    }
    if (!bio.available())
      return toast('This browser will not do Face ID, sir.');

    const p = prompt('Your passphrase, to tie it to Face ID:');
    if (!p) return;
    try {
      // Prove it's the right one before wrapping it.
      const meta = (await db.select('pa_meta', `user_id=eq.${uid()}&select=*`))[0];
      const test = await deriveKey(p, meta.kdf_salt, meta.kdf_iters || CFG.kdfIters);
      const saved = S.key; S.key = test;
      const ok = await decStr(meta.verifier).catch(() => null);
      S.key = saved;
      if (ok !== 'pa-vault-ok') return toast('That is not the passphrase, sir.');

      try {
        await bio.enrol(p);
        closeSheet();
        return toast('Face ID it is, sir. The passphrase still works.');
      } catch (prfErr){
        const weaker = confirm(
          'This iOS cannot tie a key to Face ID properly.\n\n' +
          'There is a lesser version: your passphrase is kept in this browser\'s ' +
          'storage and Face ID guards the button rather than the maths. Anyone ' +
          'who can read this phone\'s storage could recover it.\n\n' +
          'Use the lesser version?');
        if (!weaker) return toast('Passphrase it stays, sir. Probably wise.');
        await bio.enrolWeak(p);
        closeSheet();
        toast('Done, sir — the lesser version. Keep the phone locked.');
      }
    } catch (e){ toast(e.message || 'Face ID would not play along, sir.'); }
  };

  $('#f-try').onclick = () => voice.speak(
    'Good evening, sir. Two things want your attention, and one of them you have ' +
    'been ignoring since Tuesday.');
};

/* ---------------------------------------------------------------- gate */
$('#g-signin').onclick = async () => {
  const btn = $('#g-signin');
  btn.disabled = true; btn.textContent = 'One moment…';
  try {
    await signIn($('#g-email').value.trim(), $('#g-pw').value);
    toUnlock();
  } catch (err){
    toast(err.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};

async function toUnlock(){
  $('#gate').hidden = true;
  $('#app').hidden = false;
  renderAll();
  show('brief');
  loadContext();
  if ('Notification' in window && Notification.permission === 'default')
    Notification.requestPermission();
  if (wake.on) setTimeout(() => wake.start(), 1200);
  setTimeout(() => {
    const h = new Date().getHours();
    voice.speak((h < 12 ? 'Good morning, sir.' : h < 18 ? 'Good afternoon, sir.' : 'Good evening, sir.') +
      ' The vault is shut. Ask when you want it open.');
  }, 600);
}


/* --------------------------------------------------------------- boot */
(async function boot(){
  if (CFG.url.includes('YOUR-PROJECT')){
    $('#gate-lede').textContent = 'Add your Supabase URL and anon key at the top of index.html.';
    return;
  }
  const s = store.s;
  if (s){
    S.session = s;
    if (Date.now() > s.expires_at) await refresh();
    if (S.session) toUnlock();
  }
})();
</script>
