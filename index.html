}

/* ------------------------------------------------------------ face id */
/* Face ID cannot hand over an encryption key by itself — WebAuthn signs,
   it doesn't decrypt. The PRF extension can return a secret tied to the
   credential, and that is used here to wrap your passphrase. Without PRF
   there is no honest way to do this, so the passphrase stays the route. */
const bio = {
  get cred(){ try { return JSON.parse(localStorage.getItem('pa.cred') || 'null'); } catch { return null; } },
  set cred(v){ v ? localStorage.setItem('pa.cred', JSON.stringify(v)) : localStorage.removeItem('pa.cred'); },

  available(){
    return !!(window.PublicKeyCredential &&
              navigator.credentials &&
              window.isSecureContext);
  },
  enrolled(){ return !!this.cred; },

  async keyFrom(secret){
    const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'HKDF', hash:'SHA-256', salt: te.encode('pa.bio.v1'), info: te.encode('wrap')},
      base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  },

  async enrol(passphrase){
    if (!this.available()) throw new Error('This device will not do it, sir.');

    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: {name: 'PA', id: location.hostname},
        user: {id: userId, name: 'vault', displayName: 'PA vault'},
        pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          // MUST stay discoverable: Apple only offers the PRF extension —
          // the thing that produces the document key — on resident
          // credentials. Making it non-discoverable to skip Safari's
          // passkey chooser silently disables PRF.
          residentKey: 'required',
          requireResidentKey: true
        },
        timeout: 60000,
        extensions: {prf: {}}
      }
    });
    if (!cred) throw new Error('Cancelled.');

    /* Don't trust prf.enabled at creation — several Safari builds omit it
       and still hand over the secret when asked. Ask, and judge on that. */
    const id = b64(cred.rawId);
    const ext = cred.getClientExtensionResults();
    this.lastExt = JSON.stringify(ext || {});

    let secret = null;
    try { secret = await this.secretFor(id); }
    catch (e){ this.lastErr = String(e.message || e); }

    if (!secret)
      throw new Error('No key from Face ID. ' +
        'create=' + this.lastExt + (this.lastErr ? ' get=' + this.lastErr : ''));

    const wrapKey = await this.keyFrom(secret);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const wrapped = await crypto.subtle.encrypt({name:'AES-GCM', iv}, wrapKey, te.encode(passphrase));
    this.cred = {id, iv: b64(iv), wrapped: b64(wrapped)};
    return true;
  },

  async secretFor(id){
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        /* naming the transport usually sends Safari straight to Face ID
           instead of showing its passkey chooser first */
        allowCredentials: [{type:'public-key', id: unb64(id), transports:['internal']}],
        userVerification: 'required',
        timeout: 60000,
        extensions: {prf: {eval: {first: te.encode('pa-vault-prf')}}}
      }
    });
    const ext = assertion && assertion.getClientExtensionResults();
    const first = ext && ext.prf && ext.prf.results && ext.prf.results.first;
    return first ? new Uint8Array(first) : null;
  },

  /* Returns the passphrase, or throws. */
  async recover(){
    const c = this.cred;
    if (!c) throw new Error('Face ID is not set up, sir.');
    if (c.mode === 'weak') return this.recoverWeak();
    const secret = await this.secretFor(c.id);
    if (!secret) throw new Error('Face ID would not give up the key, sir.');
    const wrapKey = await this.keyFrom(secret);
    const pt = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv: unb64(c.iv)}, wrapKey, unb64(c.wrapped));
    return td.decode(pt);
  },

  /* Second best, offered only when PRF is unavailable. The passphrase is
     encrypted with a key sitting in this browser's own storage, so the
     Face ID check is a gate on the interface rather than on the maths.
     Anyone who can read this phone's storage can recover the passphrase. */
  async enrolWeak(passphrase){
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: {name: 'PA', id: location.hostname},
        user: {id: crypto.getRandomValues(new Uint8Array(16)),
               name: 'vault', displayName: 'PA vault'},
        pubKeyCredParams: [{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
        authenticatorSelection: {authenticatorAttachment:'platform',
                                 userVerification:'required',
                                 residentKey:'required', requireResidentKey:true},
        timeout: 60000
      }
    });
    if (!cred) throw new Error('Cancelled.');

    const dk = crypto.getRandomValues(new Uint8Array(32));
    const wrapKey = await crypto.subtle.importKey('raw', dk, 'AES-GCM', false, ['encrypt','decrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const wrapped = await crypto.subtle.encrypt({name:'AES-GCM', iv}, wrapKey, te.encode(passphrase));
    this.cred = {mode:'weak', id: b64(cred.rawId), iv: b64(iv),
                 wrapped: b64(wrapped), dk: b64(dk)};
    return true;
  },

  async recoverWeak(){
    const c = this.cred;
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        allowCredentials: [{type:'public-key', id: unb64(c.id), transports:['internal']}],
        userVerification: 'required',
        timeout: 60000
      }
    });
    const wrapKey = await crypto.subtle.importKey('raw', unb64(c.dk), 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(c.iv)}, wrapKey, unb64(c.wrapped));
    return td.decode(pt);
  },

  forget(){ this.cred = null; }
};

/* --------------------------------------------------------- unlock UI */
let afterUnlock = null;

/* The passphrase should be a once-ever thing. Offer to tie it to Face ID
   the first time it is used successfully, while we still have it in hand. */
function offerBio(passphrase){
  if (bio.enrolled() || !bio.available()) return;
  if (localStorage.getItem('pa.bio.asked')) return;
  localStorage.setItem('pa.bio.asked', '1');

  setTimeout(() => {
    openSheet(
      '<h2>Face ID?</h2>' +
      '<p>Tie the vault to Face ID and that is the last time you type the ' +
      'passphrase on this device, sir. It still works if you ever need it.</p>' +
      '<p class="small muted">The passphrase is wrapped by a secret only Face ID ' +
      'can produce. It is never stored anywhere readable and never leaves the phone.</p>' +
      '<div style="height:1rem"></div>' +
      '<button class="btn" id="b-yes">Set up Face ID</button>' +
      '<div style="height:.6rem"></div>' +
      '<button class="btn ghost" onclick="closeSheet()">Not now</button>');

    $('#b-yes').onclick = async () => {
      const b = $('#b-yes');
      b.disabled = true; b.textContent = 'Looking…';
      try {
        await bio.enrol(passphrase);
        closeSheet();
        toast('Done, sir. A glance from now on.');
      } catch (prfErr){
        b.disabled = false; b.textContent = 'Set up Face ID';
        console.log('PRF failure:', prfErr);
        const weaker = confirm(
          'This iOS cannot tie a key to Face ID properly.\n\n' +
          'Reason: ' + String(prfErr.message || prfErr).slice(0, 220) + '\n\n' +
          'There is a lesser version: the passphrase is kept in this browser\'s ' +
          'storage and Face ID guards the button rather than the maths. Anyone ' +
          'who can read this phone\'s storage could recover it.\n\n' +
          'Use the lesser version?');
        if (!weaker) return toast('Passphrase it stays, sir.');
        try {
          await bio.enrolWeak(passphrase);
          closeSheet();
          toast('Done, sir — the lesser version. Keep the phone locked.');
        } catch { toast('Face ID would not play along, sir.'); }
      }
    };
  }, 700);
}

function sheetUnlock(then){
  afterUnlock = then || null;
  openSheet(

    (bio.enrolled()
      ? '<button class="btn" id="u-face">Unlock with Face ID</button>' +
        '<div style="height:1rem"></div>' +

async function openWith(passphrase){
  const isNew = await openVault(passphrase);
  closeSheet();
  offerBio(passphrase);          // ask once, at the moment it makes sense
  await loadAll();
  await mem.load();
  await prefs.pull();
  sync.start();
  renderAll();
  scheduleAlerts();
  autolock.touch();
  const cap = $('#face-cap');
  if (cap && !face.pending) cap.textContent = '';
  if (isNew) toast('Vault created, sir. Write that passphrase down. I am entirely serious.');
  const next = afterUnlock; afterUnlock = null;
  if (next) setTimeout(next, 200);
}

/* ---------------------------------------------------------- auto-lock */
/* Idle timer while you're in the app, plus a short grace period when you
   leave it — long enough for a WhatsApp round trip, short enough that a
   pocketed phone shuts itself. Closing the app loses the key outright:
   it only ever lives in memory. */
const autolock = {
  mins: +(localStorage.getItem('pa.autolock') || 60),  // 0 = never
  idle: null, away: null,

  set(m){
    this.mins = m;
    localStorage.setItem('pa.autolock', String(m));
    prefs.save();
    this.touch();
  },

  touch(){
    clearTimeout(this.idle);
    if (docsLocked() || !this.mins) return;
    this.idle = setTimeout(() => {
      if (!docsLocked()) relock();          // documents shut; the diary stays
    }, this.mins * 60000);
  },

  left(){
    clearTimeout(this.away);
    if (docsLocked() || !this.mins) return;
    this.away = setTimeout(() => { if (!docsLocked()) relock(); }, 300000);
  },

  back(){ clearTimeout(this.away); this.touch(); }
};

['touchstart','click','keydown'].forEach(ev =>
  document.addEventListener(ev, () => autolock.touch(), {passive: true}));

/* ---------------------------------------------------------------- sync */
/* Two devices, one account. Data already lives in Supabase; these two
   pieces keep them from drifting: settings travel with the account, and
   whatever is on screen refreshes when you come back to the app.

   Deliberately NOT synced: the Face ID credential, which is bound to its
   own device and must be, and the session token. */
const prefs = {
  KEYS: ['pa.voice','pa.remote','pa.wake','pa.wakeword','pa.autolock','pa.face',
         'pa.rate','pa.pitch'],
  loading: false,

  local(){
    const o = {};
    for (const k of this.KEYS){
      const v = localStorage.getItem(k);
      if (v !== null) o[k] = v;
    }
    return o;
  },

  apply(o){
    if (!o) return;
    for (const k of this.KEYS) if (k in o) localStorage.setItem(k, o[k]);
    // re-read the modules that cache their settings in memory
    voice.chosen = localStorage.getItem('pa.voice') || voice.chosen;
    voice.remote = localStorage.getItem('pa.remote') === 'on';
    voice.rate  = parseFloat(localStorage.getItem('pa.rate')  || '0.96');
    voice.pitch = parseFloat(localStorage.getItem('pa.pitch') || '0.92');
    wake.word = (localStorage.getItem('pa.wakeword') || 'jarvis').toLowerCase();
    autolock.mins = +(localStorage.getItem('pa.autolock') || 60);
    face.auto = localStorage.getItem('pa.face') !== 'off';
    const on = localStorage.getItem('pa.wake') !== 'off';
    if (on !== wake.on){ wake.on = on; on ? wake.start() : wake.stop(); }
    wake.badge();
  },

  /* At unlock: whichever side was edited more recently wins. */
  async pull(){
    try {
      const row = (await db.select('pa_meta', `user_id=eq.${uid()}&select=prefs,prefs_updated`))[0];
      if (!row || !row.prefs) return this.push();
      const mineAt = +(localStorage.getItem('pa.prefs_at') || 0);
      const theirs = new Date(row.prefs_updated).getTime();
      if (theirs > mineAt){
        this.apply(row.prefs);
        localStorage.setItem('pa.prefs_at', String(theirs));
      } else if (mineAt > theirs){
        this.push();
      }
    } catch {}
  },

  async push(){
    try {
      const now = new Date().toISOString();
      await api(`pa_meta?user_id=eq.${uid()}`, {
        method: 'PATCH',
        body: JSON.stringify({prefs: this.local(), prefs_updated: now})
      });
      localStorage.setItem('pa.prefs_at', String(Date.parse(now)));
    } catch {}
  },

  /* Debounced: flicking three switches in a settings sheet is one write. */
  save(){
    clearTimeout(this._t);
    this._t = setTimeout(() => this.push(), 900);
  }
};

/* Whatever the other device did, pick it up on returning to this one. */
const sync = {
  last: 0, timer: null,

  async refresh(force){
    if (locked()) return;
    const now = Date.now();
    if (!force && now - this.last < 20000) return;   // don't thrash
    this.last = now;
    try {
      await loadAll();
      await mem.load();
      renderAll();
      scheduleAlerts();
    } catch {}
  },

  start(){
    clearInterval(this.timer);
    // a quiet poll while you're actually looking at it
    this.timer = setInterval(() => {
      if (document.visibilityState === 'visible') this.refresh();
    }, 45000);
  },

  stop(){ clearInterval(this.timer); }
};

/* --------------------------------------------------------- wake word */
/* Safari hands out recognition in short bursts, so "always listening"
   means restarting the moment each one ends. There's a hair of deafness
   between sessions — occasionally you'll have to say it twice. When the
   phone locks, iOS takes the microphone back; unlocking tries to grab it
   again, and offers a tap if it's refused. */
const wake = {
  on: localStorage.getItem('pa.wake') !== 'off',
  word: (localStorage.getItem('pa.wakeword') || 'jarvis').toLowerCase(),
  rec: null, running: false, awake: false, sleepTimer: null,

  set(on){
    this.on = on;
    localStorage.setItem('pa.wake', on ? 'on' : 'off');
    prefs.save();
    on ? this.start() : this.stop();
  },
  setWord(w){
    this.word = (w || 'jarvis').trim().toLowerCase();
    localStorage.setItem('pa.wakeword', this.word);
    prefs.save();
  },

  start(){
    if (!Rec || !this.on || this.running || rec) return;   // never fight the tap-to-talk mic
    try {
      this.rec = new Rec();
      this.rec.lang = 'en-GB';
      this.rec.continuous = true;
      this.rec.interimResults = true;
      this.rec.onresult = e => this.heard(e);
      this.rec.onerror = ev => {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
          this.running = false; this.needsTap(); return;
        }
      };
      this.rec.onend = () => {
        this.running = false;
        // restart promptly; every millisecond here is a millisecond deaf
        if (this.on && !rec) setTimeout(() => this.start(), 80);
      };
      this.rec.start();
      this.running = true;
      this.badge(true);
    } catch { this.running = false; }
  },

  stop(){
    this.on = false; this.running = false; this.awake = false;
    try { this.rec && this.rec.stop(); } catch {}
    this.rec = null;
    this.badge(false);
  },

  pause(){ this.running = false; try { this.rec && this.rec.stop(); } catch {} this.rec = null; },
  resume(){ if (this.on) setTimeout(() => this.start(), 300); },

  heard(e){
    const last = e.results[e.results.length - 1];
    const text = last[0].transcript.trim();
    if (!text) return;

    /* The wake word is matched on interim results. Waiting for a final
       transcript costs a second or more, which is most of why it felt
       slow. Commands still wait for the final, where accuracy matters. */
    if (!this.awake){
      const lower = text.toLowerCase();
      const i = lower.indexOf(this.word);
      if (i === -1) return;                 // discarded here, never sent anywhere
      const now = Date.now();
      if (now - (this.lastRouse || 0) < 1500) return;   // one wake per phrase
      this.lastRouse = now;
      const after = text.slice(i + this.word.length).replace(/^[\s,.:;-]+/, '');
      // if the rest is still being spoken, wait for the final before acting
      this.rouse(last.isFinal ? after : '');
      return;
    }

    if (!last.isFinal) return;

    clearTimeout(this.sleepTimer);
    this.sleepTimer = setTimeout(() => this.doze(), 25000);
    if (compose.active) compose.handle(text);
    else { this.doze(); ask(text); }
  },

  rouse(rest){
    this.awake = true;
    this.badge(true);
    clearTimeout(this.sleepTimer);
    this.sleepTimer = setTimeout(() => this.doze(), 25000);
    if (rest && rest.split(/\s+/).length > 1){
      if (compose.looksLikeMessage(rest)) return compose.begin(rest);
      return ask(rest);
    }
    // A short answer so you know it is listening. No caption: it is an
    // acknowledgement, not something to read.
    const ack = pick(['Yes, sir.', 'Yes, sir.', 'Sir?']);
    const cap = $('#face-cap');
    const held = cap ? cap.textContent : '';
    voice.speak(ack);
    if (cap) setTimeout(() => { cap.textContent = held; }, 60);
  },

  doze(){
    this.awake = false;
    clearTimeout(this.sleepTimer);
    this.badge(true);
  },

  needsTap(){
    const b = $('#wake-bar');
    b.hidden = false;
    b.onclick = () => { b.hidden = true; this.start(); };
  },

  badge(){
    const el = $('#wake-dot');
    if (!el) return;
    el.hidden = !this.on;
    el.textContent = this.awake ? '● listening' : '○ ' + this.word.charAt(0).toUpperCase() + this.word.slice(1);
  }
};

/* ------------------------------------------------------------ compose */
/* Fills in WhatsApp, Messages or Mail and hands it to you. iOS will not
   let any app press send in another app, so the last tap is always yours. */
const READY = [
  'That is all ready for you to send, sir.',
  'Ready and waiting, sir. Yours to send.',
  'Written and loaded, sir. The send button is your department.',
  'There you are, sir. One tap and it is gone.',
  'All set, sir. I will leave the sending to you.',
  'Done, sir. Read it back before you send it, if you have any sense.'
];

function intlNumber(raw){
  let n = String(raw || '').replace(/[^\d+]/g, '');
  if (n.startsWith('+'))  return n.slice(1);
  if (n.startsWith('00')) return n.slice(2);
  if (n.startsWith('0'))  return '44' + n.slice(1);     // UK unless told otherwise
  return n;
}

const compose = {
  active: false, channel: null, to: null, contact: null,
  subject: null, body: null, awaiting: null, nudge: null, options: null,

  reset(){
    clearTimeout(this.nudge);
    Object.assign(this, {active:false, channel:null, to:null, contact:null,
      subject:null, body:null, awaiting:null, nudge:null, options:null});
  },

  looksLikeMessage(t){
    if (!this.channelOf(t)) return false;
    return /\b(send|write|message|text|email|tell\w*|say|drop|shoot|fire)\b/i.test(t) ||
           /^\s*(whats ?app|text|email|sms|message)\b/i.test(t);
  },

  channelOf(t){
    if (/\bwhats ?app\b/i.test(t)) return 'whatsapp';
    if (/\be ?mail\b/i.test(t))    return 'email';
    if (/\b(text|sms|message)\b/i.test(t)) return 'sms';
    return null;
  },

  /* "to Dave" is ambiguous — "I want to send" has a "to" in it as well.
     Scan every "to" and keep the last candidate that isn't swallowing a verb. */
  recipientIn(t){
    const stop = /\b(send|write|whats ?app|e ?mail|text|sms|message|want|like|going|need)\b/i;
    const tail = '(?=\\s+(saying|telling|that says|that|about|regarding|with|and\\s+say|and\\s+tell)\\b|[,.!?]|$)';
    const name = "((?:the\\s+)?[a-z][a-z'\\- ]{1,28}?)";
    let found = null;

    const re = /\bto\s+/gi;
    let m;
    while ((m = re.exec(t)) !== null){
      const rest = t.slice(m.index + m[0].length);
      const hit = rest.match(new RegExp('^' + name + tail, 'i'));
      if (hit && !stop.test(hit[1])) found = hit[1].trim();
      re.lastIndex = m.index + m[0].length;   // don't skip later "to"s
    }
    if (found) return found;

    // "whatsapp mum telling her..." / "email the accountant about..."
    const direct = t.match(new RegExp(
      '(?:whats ?app|e ?mail|text|sms|message)\\s+(?!to\\b)' + name + tail, 'i'));
    if (direct && !stop.test(direct[1])) return direct[1].trim();
    return null;
  },

  begin(utterance){
    this.reset();
    this.active = true;
    this.channel = this.channelOf(utterance);
    this.to = this.recipientIn(utterance);

    const body = utterance.match(/\b(?:saying|telling (?:him|her|them)|that says|and say|and tell (?:him|her|them))\s+(.+)$/i);
    if (body) this.body = body[1].trim().replace(/[.]$/, '');

    if (this.channel === 'email'){
      const subj = utterance.match(/\b(?:about|regarding|re)\s+(.+?)(?=\s+(saying|and say)\b|[,.!?]|$)/i);
      if (subj) this.subject = subj[1].trim();
    }

    this.next();
  },

  say(line){
    say(esc(line), line);
    clearTimeout(this.nudge);
    this.nudge = setTimeout(() => {
      if (this.active && this.awaiting)
        voice.speak(pick(['Whenever you are ready, sir.',
                          'Still with you, sir.',
                          'Take your time. I am listening.']));
    }, 9000);
  },

  next(){
    if (!this.channel){
      this.awaiting = 'channel';
      return this.say('WhatsApp, text or email, sir?');
    }
    if (!this.to){
      this.awaiting = 'to';
      return this.say('Who am I sending it to?');
    }
    if (!this.contact && !this.resolve()) return;
    if (this.channel === 'email' && !this.subject){
      this.awaiting = 'subject';
      return this.say('What shall I put as the subject?');
    }
    if (!this.body){
      this.awaiting = 'body';
      return this.say(pick(['And what would you like it to say?',
                            'Go ahead, sir. I am taking it down.',
                            'What am I writing?']));
    }
    this.finish();
  },

  /* Match against the contacts already in the vault. */
  resolve(){
    const want = this.to.toLowerCase().trim();
    const needsEmail = this.channel === 'email';
    const usable = S.contacts.filter(c => needsEmail ? c._.email : c._.phone);
    let hits = usable.filter(c => (c._.name || '').toLowerCase().includes(want));
    if (!hits.length)
      hits = usable.filter(c => want.split(/\s+/)
        .some(w => w.length > 2 && (c._.name || '').toLowerCase().includes(w)));

    if (hits.length === 1){ this.contact = hits[0]; return true; }

    if (hits.length > 1){
      this.options = hits;
      this.awaiting = 'which';
      this.say('You have ' + hits.length + ' of those, sir. ' +
        hits.map(c => c._.name + (c._.relationship ? ', the ' + c._.relationship : ''))
            .join('; or ') + '. Which one?');
      return false;
    }

    this.awaiting = 'detail';
    this.say('I have no ' + (needsEmail ? 'email address' : 'number') +
      ' for ' + this.to + ', sir. Give it to me and I will use it this once.');
    return false;
  },

  handle(text){
    const t = text.trim();
    if (!t) return;
    clearTimeout(this.nudge);
    if (/^(cancel|stop|forget it|never mind)\b/i.test(t)){
      this.reset();
      return say('Dropped, sir.', 'Dropped, sir.');
    }
    heard(t);

    switch (this.awaiting){
      case 'channel': this.channel = this.channelOf(t) || null; break;
      case 'to':      this.to = t.replace(/^(to\s+)?/i, '').replace(/[.,]$/, ''); break;
      case 'which': {
        const m = this.options.find(c =>
          (c._.name || '').toLowerCase().includes(t.toLowerCase().split(/\s+/)[0]) ||
          (c._.relationship || '').toLowerCase().includes(t.toLowerCase()));
        if (m) this.contact = m;
        break;
      }
      case 'detail': {
        const val = t.replace(/\s+/g, '');
        this.contact = {_: this.channel === 'email' ? {name: this.to, email: val}
                                                    : {name: this.to, phone: val}};
        break;
      }
      case 'subject': this.subject = t.replace(/[.]$/, ''); break;
      case 'body':    this.body = t; break;
    }
    this.awaiting = null;
    this.next();
  },

  finish(){
    const c = this.contact._;
    let url;

    if (this.channel === 'whatsapp'){
      url = 'https://wa.me/' + intlNumber(c.phone) + '?text=' + encodeURIComponent(this.body);
    } else if (this.channel === 'sms'){
      url = 'sms:' + (c.phone || '').replace(/\s/g, '') +
            '&body=' + encodeURIComponent(this.body);
    } else {
      url = 'mailto:' + c.email +
            '?subject=' + encodeURIComponent(this.subject || '') +
            '&body=' + encodeURIComponent(this.body);
    }

    const line = pick(READY);
    say('<b>' + esc(c.name) + '</b><br>' +
        (this.subject ? esc(this.subject) + '<br>' : '') +
        '<span class="muted">' + esc(this.body) + '</span><br><br>' + esc(line), line);

    const target = this.channel;
    this.reset();
    wake.pause();
    setTimeout(() => {
      if (target === 'whatsapp') window.open(url, '_blank');
      else location.href = url;
    }, 1400);      // let it finish speaking before the app switch
  }
};

/* ------------------------------------------------- reminders by voice */
/* Saying it should be enough. If a time can be read out of what was said,
   file it there and then; only open the form when it genuinely cannot. */
const WHEN = [
  [/\btomorrow\b/i,              () => at(1, 9)],
  [/\btonight\b/i,               () => at(0, 19)],
  [/\bthis evening\b/i,          () => at(0, 18)],
  [/\bthis afternoon\b/i,        () => at(0, 14)],
  [/\bthis morning\b/i,          () => at(0, 9)],
  [/\bnext week\b/i,             () => at(7, 9)],
  [/\bin (\d+) days?\b/i,        m => at(+m[1], 9)],
  [/\bin (\d+) weeks?\b/i,       m => at(+m[1]*7, 9)],
  [/\bin an hour\b/i,            () => at(0, new Date().getHours() + 1)],
  [/\bin (\d+) hours?\b/i,       m => at(0, new Date().getHours() + (+m[1]))],
  [/\b(mon|tues|wednes|thurs|fri|satur|sun)day\b/i, m => nextDay(m[1])],
  [/\btoday\b/i,                 () => at(0, Math.max(new Date().getHours() + 1, 9))]
];

function at(daysAhead, hour){
  const d = new Date();
  d.setDate(d.getDate() + daysAhead);
  d.setHours(hour, 0, 0, 0);
  return d;
}
function nextDay(name){
  const names = ['sun','mon','tues','wednes','thurs','fri','satur'];
  const want = names.indexOf(name.toLowerCase());
  const d = new Date();
  let add = (want - d.getDay() + 7) % 7;
  if (add === 0) add = 7;
  d.setDate(d.getDate() + add);
  d.setHours(9, 0, 0, 0);
  return d;
}

function readWhen(text){
  let when = null;
  for (const [re, fn] of WHEN){
    const m = text.match(re);
    if (m){ when = fn(m); break; }
  }
  // an explicit clock time overrides the hour
  const clock = text.match(/\bat\s+(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\b/i);
  if (clock){
    if (!when) when = at(0, 9);
    let h = +clock[1];
    const min = clock[2] ? +clock[2] : 0;
    const ap = (clock[3] || '').toLowerCase();
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    if (!ap && h <= 7) h += 12;              // "at 6" means the evening
    when.setHours(h, min, 0, 0);
    if (when < new Date() && !/\b(tomorrow|next|in \d)/i.test(text))
      when.setDate(when.getDate() + 1);      // that hour has gone; mean tomorrow
  }
  return when;
}

async function quickEvent(raw, lower){
  const kind = /remind/i.test(lower) ? 'reminder'
             : /\bbook\b/i.test(lower) ? 'appointment' : 'note';
  let title = raw
    .replace(/^(add|note|remind me to|remind me|put in|book)\s*/i, '')
    .replace(/\b(tomorrow|tonight|this evening|this afternoon|this morning|next week|today)\b/gi, '')
    .replace(/\bin \d+ (days?|weeks?|hours?)\b/gi, '')
    .replace(/\bin an hour\b/gi, '')
    .replace(/\bat\s+\d{1,2}([:.]\d{2})?\s*(am|pm)?\b/gi, '')
    .replace(/\bon\s+(mon|tues|wednes|thurs|fri|satur|sun)day\b/gi, '')
    .replace(/\b(mon|tues|wednes|thurs|fri|satur|sun)day\b/gi, '')
    .replace(/\s{2,}/g, ' ')
    .replace(/[\s,]+$/, '')
    .trim();

  const when = readWhen(raw);
  if (!title || !when){
    say('Very good, sir. I have it open.', 'Very good, sir.');
    return sheetAddEvent({title: title, kind: kind});
  }

  try {
    await db.insert('pa_events', {
      kind: kind, owner_tag: 'personal',
      starts_at: when.toISOString(),
      all_day: false, important: true, recurs: 'none',
      alerts: [{minutes_before: 60}],
      payload_enc: await encJSON({title: title, notes: ''})
    });
    await loadAll(); renderAll(); scheduleAlerts();
    const line = 'Noted, sir. ' + title.charAt(0).toUpperCase() + title.slice(1) +
      ', ' + prettyWhen(when.toISOString(), false) + '.';
    say(esc(line), line);
  } catch (e){
    say('That would not save, sir. I have opened the form instead.',
        'That would not save, sir.');
    sheetAddEvent({title: title, kind: kind});
  }
}

/* ------------------------------------------------------------- alerts */
let alertTimers = [];
function scheduleAlerts(){
  alertTimers.forEach(clearTimeout);
  alertTimers = [];
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  for (const e of S.events){
    if (e.done || !e.starts_at) continue;
    for (const a of (e.alerts || [])){
      const at = new Date(e.starts_at).getTime() - a.minutes_before * 60000;
      if (at > now && at - now < 6 * 3600000){
        alertTimers.push(setTimeout(() => {
          new Notification(e._.title, {body: prettyWhen(e.starts_at, e.all_day)});
          voice.speak(e._.title + ', ' + prettyWhen(e.starts_at, e.all_day));
        }, at - now));
      }
    }
  }
}

$('#face').addEventListener('click', e => {
  if (e.target.closest('#face-x')) return;      // the Hide button is its own thing

  const cap = $('#face-cap');

  // No day key on this device yet: the passphrase is needed once.
  if (locked()){
    voice.openingLine(greeting());
    if (cap) cap.textContent = '';
    return sheetUnlock();
  }

  // Stop it if it is mid-sentence.
  if (speechSynthesis.speaking || speechSynthesis.pending ||
      (audio && !audio.paused && !audio.ended)){
    return voice.toggleFromTap('');
  }

  const firstToday = localStorage.getItem('pa.briefed') !== todayISO();
  if (firstToday){
    localStorage.setItem('pa.briefed', todayISO());
    voice.toggleFromTap(greeting() + ' ' +
      briefSentence(5, {noGreeting: true, close: true}));
  } else {
    voice.toggleFromTap('How can I help you, sir?');
  }
  face.pending = null;
});

          (autolock.mins === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') +
    '</select>' +
    '<p class="small muted">It also shuts if you leave the app for more than a ' +
      'minute and a half, and whenever the app is closed outright.</p>' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn danger" id="f-out">Sign out</button>' +
    '<div style="height:.6rem"></div>' +
    '<button class="btn" onclick="closeSheet()">Done</button>');
  const label = () => {
    const pc = v => Math.round(v * 100) + '%';
    $('#f-rate-v').textContent  = pc(voice.rate);
    $('#f-pitch-v').textContent = pc(voice.pitch);
  };
  label();

  const demo = () => voice.toggleFromTap(
    'Good evening, sir. Two things want your attention, and one of them ' +
    'you have been ignoring since Tuesday.');

  $('#f-rate').oninput = e => { voice.setRate(parseFloat(e.target.value)); label(); };
  $('#f-rate').onchange = demo;
  $('#f-pitch').oninput = e => { voice.setPitch(parseFloat(e.target.value)); label(); };
  $('#f-pitch').onchange = demo;

  $('#f-voice').onchange = e => { voice.set(e.target.value); demo(); };
  $('#f-remote').onchange = e => voice.setRemote(e.target.checked);
  $('#f-wake').onchange = e => {
    wake.set(e.target.checked);
    toast(e.target.checked ? 'Listening, sir.' : 'Ears off, sir.');
  };
  $('#f-word').onchange = e => { wake.setWord(e.target.value); wake.badge(); };
  $('#f-auto').onchange = e => autolock.set(+e.target.value);
  $('#f-faceauto').onchange = e => {
    face.auto = e.target.checked;
    localStorage.setItem('pa.face', e.target.checked ? 'on' : 'off');
    prefs.save();
  };
  if ($('#f-open')) $('#f-open').onclick = () => { closeSheet(); requireDocs(renderVault); };
  if ($('#f-lock')) $('#f-lock').onclick = () => { closeSheet(); relock(); };
  if ($('#f-out'))  $('#f-out').onclick  = () => signOut();

  if ($('#f-face')) $('#f-face').onclick = async () => {
    if (bio.enrolled()){
      bio.forget();
      closeSheet();
      return toast('Face ID forgotten, sir. Passphrase from now on.');
    }
    if (!bio.available())
      return toast('This browser will not do Face ID, sir.');

    const p = prompt('Your passphrase, to tie it to Face ID:');
    if (!p) return;
    try {
      // Prove it's the right one before wrapping it.
      const meta = (await db.select('pa_meta', `user_id=eq.${uid()}&select=*`))[0];
      const test = await deriveKey(p, meta.kdf_salt, meta.kdf_iters || CFG.kdfIters);
      const saved = S.key; S.key = test;
      const ok = await decStr(meta.verifier).catch(() => null);
      S.key = saved;
      if (ok !== 'pa-vault-ok') return toast('That is not the passphrase, sir.');

      try {
        await bio.enrol(p);
        closeSheet();
        return toast('Face ID it is, sir. The passphrase still works.');
      } catch (prfErr){
        const weaker = confirm(
          'This iOS cannot tie a key to Face ID properly.\n\n' +
          'Reason: ' + String(prfErr.message || prfErr).slice(0, 220) + '\n\n' +
          'There is a lesser version: your passphrase is kept in this browser\'s ' +
          'storage and Face ID guards the button rather than the maths. Anyone ' +
          'who can read this phone\'s storage could recover it.\n\n' +
          'Use the lesser version?');
        if (!weaker) return toast('Passphrase it stays, sir. Probably wise.');
        await bio.enrolWeak(p);
        closeSheet();
        toast('Done, sir — the lesser version. Keep the phone locked.');
      }
    } catch (e){ toast(e.message || 'Face ID would not play along, sir.'); }
  };

  const diag = () => {
    const ok = 'speechSynthesis' in window;
    $('#f-diag').textContent = !ok ? 'This browser has no speech at all.'
      : voice.list.length + ' voices found. Using: ' + (voice.chosen || 'the default')
        + '. ' + (speechSynthesis.speaking ? 'Speaking now.' : 'Idle.')
        + ' If you hear nothing, check the silent switch on the side of the phone.';
  };
  diag();

  $('#f-try').onclick = () => { setTimeout(diag, 700); voice.speak(
    'Good evening, sir. Two things want your attention, and one of them you have ' +
    'been ignoring since Tuesday.'); };
};

/* ---------------------------------------------------------------- gate */
$('#g-signin').onclick = async () => {
  primeAudio();
  const btn = $('#g-signin');
  btn.disabled = true; btn.textContent = 'One moment…';
  try {
    await signIn($('#g-email').value.trim(), $('#g-pw').value);
    toUnlock();
  } catch (err){
    toast(err.message);
    btn.disabled = false; btn.textContent = 'Sign in';
  }
};

async function toUnlock(){
  $('#gate').hidden = true;
  $('#app').hidden = false;

  // Everyday things need no ceremony if this device has been used before.
  const day = await keys.recall();
  if (day){
    S.key = day;
    try {
      await loadAll();
      await mem.load();
      await prefs.pull();
      sync.start();
      scheduleAlerts();
      autolock.touch();
    } catch {}
  }
  renderAll();
  show('ask');
  face.show();
  loadContext();
  if ('Notification' in window && Notification.permission === 'default')
    Notification.requestPermission();
  if (wake.on) setTimeout(() => wake.start(), 1200);
  const cap = $('#face-cap');
  if (cap) cap.textContent = 'Tap me, sir.';
}


/* --------------------------------------------------------------- boot */
(async function boot(){
  if (CFG.url.includes('YOUR-PROJECT')){
    $('#gate-lede').textContent = 'Add your Supabase URL and anon key at the top of index.html.';
    return;
  }
  const s = store.s;
  if (s){
    S.session = s;
    if (Date.now() > s.expires_at) await refresh();
    if (S.session) toUnlock();
  }
})();
</script>
</body>
</html>
