<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PA face</title>
<style>
:root{ color-scheme: dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#06070b;overflow:hidden;
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e8e9ec}
#face-cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:.7rem .7rem calc(.9rem + env(safe-area-inset-bottom));
  background:linear-gradient(to top, rgba(6,7,11,.94), rgba(6,7,11,0));
  display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
button{font:inherit;color:#e8e9ec;background:rgba(20,24,34,.85);
  border:1px solid #2c3446;border-radius:9px;padding:.5rem .8rem}
button[aria-pressed="true"]{border-color:#c8a25c;color:#c8a25c}
#say{border-color:#c8a25c;color:#20180a;background:#c8a25c;font-weight:600;flex-basis:100%}
#cap{position:fixed;left:1rem;right:1rem;bottom:7.2rem;text-align:center;
  text-shadow:0 2px 12px #000;font-size:.95rem;min-height:2.6em;z-index:4}
</style>
</head>
<body>
<canvas id="face-cv"></canvas>
<div id="cap"></div>
<div id="panel">
  <button id="say">Say something</button>
  <button data-m="dry" aria-pressed="true">dry</button>
  <button data-m="amused">amused</button>
  <button data-m="concerned">concerned</button>
  <button data-m="flat">flat</button>
  <button data-m="pleased">pleased</button>
  <button data-m="sharp">sharp</button>
</div>
<script>
const $ = s => document.querySelector(s);
/* --------------------------------------------------------------- face */
/* A low-poly head: lit facets with quantised shading, over a radiating
   line background. Canvas 2D, no libraries, no network. The jaw drops
   with the speech; the brows and colour follow the mood. */
const face = {
  cv: null, ctx: null, raf: null, open: false,
  mouth: 0, aim: 0, blink: 0, nextBlink: 0,
  brow: 0, browAim: 0, yaw: 0, pitch: 0,
  mood: 'dry', talking: false, env: null, t: 0, phase: 0, faces: null,
  auto: localStorage.getItem('pa.face') !== 'off',

  SEG: 30,
  BASE: [
    [-1.08,0.34,0.36,-0.05], [-0.96,0.64,0.62,-0.03], [-0.78,0.82,0.76,-0.01],
    [-0.58,0.88,0.80, 0.01], [-0.36,0.90,0.80, 0.02], [-0.12,0.87,0.78, 0.03],
    [ 0.14,0.80,0.71, 0.03], [ 0.36,0.70,0.62, 0.02], [ 0.60,0.56,0.50, 0.00],
    [ 0.82,0.39,0.36,-0.02], [ 0.97,0.20,0.20,-0.05]
  ],
  RINGS: null,
  EYE: [0.38,-0.32,0.68], MOUTH: [0,0.42,0.62],

  MOODS: {
    dry:      {brow:-0.10, skin:[176,186,200], rim:[150,176,216], jitter:0.5},
    amused:   {brow: 0.24, skin:[188,190,186], rim:[200,190,150], jitter:0.8},
    concerned:{brow: 0.44, skin:[184,170,168], rim:[212,130,110], jitter:1.4},
    flat:     {brow: 0.00, skin:[170,174,180], rim:[140,146,158], jitter:0.3},
    pleased:  {brow: 0.18, skin:[178,190,182], rim:[140,200,164], jitter:0.6},
    sharp:    {brow:-0.34, skin:[192,186,168], rim:[226,176,90],  jitter:1.2}
  },

  /* Satin metal rather than mirror chrome: a cool diffuse base, two hard
     speculars and a rim light. Mirror chrome puts its dark half straight
     through the middle of the face, which looks wrong on a head. */
  metal(nx, ny, nz, SK, RM){
    const dot = L => Math.max(0, nx*L[0] + ny*L[1] + nz*L[2]);
    const key = dot([-0.48,-0.60,-0.64]);
    const fill = dot([0.62,-0.10,-0.78]);
    const back = dot([0.10,0.55,0.50]);
    const v = 0.26 + 0.58*key + 0.20*fill + 0.10*back;
    const spec = 0.85*Math.pow(key,34) + 0.45*Math.pow(fill,18);
    const rim = 0.34*Math.pow(1 - Math.abs(nz), 3.2);
    return 'rgb(' + Math.min(255, SK[0]*v + 255*spec + RM[0]*rim|0) + ','
                  + Math.min(255, SK[1]*v + 255*spec + RM[1]*rim|0) + ','
                  + Math.min(255, SK[2]*v + 255*spec + RM[2]*rim|0) + ')';
  },

  buildFaces(){
    const b = this.BASE, r = [b[0]];
    for (let i = 0; i < b.length - 1; i++){
      r.push(b[i].map((v,k) => (v + b[i+1][k])/2));
      r.push(b[i+1]);
    }
    this.RINGS = r;
    const S = this.SEG, R = this.RINGS.length, out = [];
    for (let r = 0; r < R - 1; r++)
      for (let s = 0; s < S; s++)
        out.push([r*S+s, r*S+(s+1)%S, (r+1)*S+(s+1)%S, (r+1)*S+s]);
    this.faces = out;
  },

  verts(mouth){
    const S = this.SEG, out = [];
    for (let ri = 0; ri < this.RINGS.length; ri++){
      const R = this.RINGS[ri];
      for (let si = 0; si < S; si++){
        const a = (si/S)*Math.PI*2, ca = Math.cos(a), sa = Math.sin(a);
        const x = ca*R[1];
        let z = sa*R[2] + R[3];
        const f = Math.max(0, sa);
        const near = Math.exp(-(ca*ca)/0.09)*f;
        const y0 = R[0];
        if (y0 > -0.66 && y0 < -0.46) z += 0.11*near;   // brow ridge
        if (y0 > -0.46 && y0 < -0.24) z += 0.05*near;
        if (y0 > -0.24 && y0 <  0.02) z += 0.22*near;   // nose
        if (y0 >  0.02 && y0 <  0.24) z += 0.12*near;
        if (y0 >  0.24 && y0 <  0.46) z += 0.05*near;
        if (y0 >  0.46 && y0 <  0.92) z += 0.04*near;
        let y = y0;
        if (y0 > 0.30){
          const k = Math.min(1, (y0 - 0.30)/0.67);
          y += mouth*0.22*k;
          z -= mouth*0.06*k*f;
        }
        out.push([x, y, z]);
      }
    }
    return out;
  },

  show(){
    if (this.open) return;
    this.open = true;
    
    this.cv = document.getElementById('face-cv'); this.ctx = this.cv.getContext('2d');
    if (!this.faces) this.buildFaces();
    this.size();
    this.nextBlink = performance.now() + 1400;
    this.loop();
  },
  hide(){ this.open = false;  cancelAnimationFrame(this.raf); },
  size(){
    const d = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = this.cv.clientWidth*d; this.cv.height = this.cv.clientHeight*d;
    this.ctx.setTransform(d,0,0,d,0,0);
  },

  setMood(m){ if (this.MOODS[m]){ this.mood = m; this.browAim = this.MOODS[m].brow; } },

  startTalk(text){
    this.talking = true;
    if (this.auto && !this.open) this.show();
    const words = Math.max(1, (text||'').trim().split(/\s+/).length);
    this.env = {t0: performance.now(), beats: Math.round(words*1.6), per: 135};
  },
  stopTalk(){ this.talking = false; this.env = null; this.aim = 0; },

  attach(audioEl){
    try {
      if (this.an) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(audioEl);
      this.an = ctx.createAnalyser(); this.an.fftSize = 512;
      src.connect(this.an); this.an.connect(ctx.destination);
      this.buf = new Uint8Array(this.an.frequencyBinCount);
    } catch {}
  },

  level(){
    if (this.an && this.talking){
      this.an.getByteFrequencyData(this.buf);
      let s = 0; for (let i = 2; i < 40; i++) s += this.buf[i];
      return Math.min(1, s/(38*128));
    }
    if (!this.env) return 0;
    const i = (performance.now() - this.env.t0)/this.env.per;
    if (i > this.env.beats + 1) return 0;
    return Math.sin((i%1)*Math.PI)*(0.55 + 0.45*Math.abs(Math.sin(i*2.7)));
  },

  loop(){
    this.raf = requestAnimationFrame(() => this.loop());
    const now = performance.now();
    this.t = now/1000;
    this.aim = this.talking ? this.level() : 0;
    this.mouth += (this.aim - this.mouth)*0.45;
    this.brow += (this.browAim - this.brow)*0.08;
    if (now > this.nextBlink){ this.blink = 1; this.nextBlink = now + 2000 + Math.random()*4500; }
    this.blink = Math.max(0, this.blink - 0.14);
    this.yaw = 0.26*Math.sin(this.t*0.19) + 0.08*Math.sin(this.t*0.47);
    this.pitch = 0.05*Math.sin(this.t*0.23 + 1);
    this.phase += 0.0016;
    this.draw();
  },

  draw(){
    const c = this.ctx, W = this.cv.clientWidth, H = this.cv.clientHeight;
    const M = this.MOODS[this.mood], SK = M.skin, RM = M.rim;
    const cx = W/2, cy = H*0.36, R = Math.min(W,H)*0.33;

    c.fillStyle = '#06070b'; c.fillRect(0,0,W,H);
    this.rays(c, W, H, cx, cy - R*0.10);

    const g = c.createRadialGradient(cx, cy+R*0.1, R*0.4, cx, cy+R*0.1, R*1.9);
    g.addColorStop(0,'rgba(4,5,9,0.96)'); g.addColorStop(1,'rgba(4,5,9,0)');
    c.fillStyle = g; c.fillRect(0,0,W,H);

    const cyw = Math.cos(this.yaw), syw = Math.sin(this.yaw);
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const tf = p => {
      const x2 = p[0]*cyw + p[2]*syw, z2 = -p[0]*syw + p[2]*cyw;
      return [x2, p[1]*cp - z2*sp, p[1]*sp + z2*cp];
    };
    const proj = p => { const q = tf(p), k = 3.6/(3.6+q[2]);
      return [cx + q[0]*R*k, cy + q[1]*R*k, q[2]]; };

    const nl = proj([-0.26,0.92,0.05]), nr = proj([0.26,0.92,0.05]);
    c.fillStyle = this.metal(0, 0.2, -0.95, SK, RM);
    c.beginPath(); c.moveTo(nl[0],nl[1]); c.lineTo(nr[0],nr[1]);
    c.lineTo(nr[0]+R*0.06, cy+R*1.34); c.lineTo(nl[0]-R*0.06, cy+R*1.34);
    c.closePath(); c.fill();

    const V = this.verts(this.mouth), T = V.map(tf);
    const quads = [];
    for (const f of this.faces){
      const A = T[f[0]], B = T[f[1]], C = T[f[2]];
      const u = [B[0]-A[0],B[1]-A[1],B[2]-A[2]];
      const w = [C[0]-A[0],C[1]-A[1],C[2]-A[2]];
      let n = [u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];
      const ln = Math.hypot(n[0],n[1],n[2]) || 1;
      n = [-n[0]/ln, -n[1]/ln, -n[2]/ln];          // outward
      if (n[2] > 0.04) continue;
      quads.push({d:(A[2]+B[2]+C[2]+T[f[3]][2])/4, f, n});
    }
    quads.sort((a,b) => b.d - a.d);

    c.lineWidth = 1;
    for (const q of quads){
      const col = this.metal(q.n[0], q.n[1], q.n[2], SK, RM);
      c.fillStyle = col; c.strokeStyle = col;   // stroke hides the seams
      c.beginPath();
      for (let i = 0; i < 4; i++){
        const p = proj(V[q.f[i]]);
        i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]);
      }
      c.closePath(); c.fill(); c.stroke();
    }

    for (const s of [-1,1]){
      const p = proj([s*this.EYE[0], this.EYE[1], this.EYE[2]]);
      const w_ = R*0.145, h_ = R*0.070*(1 - this.blink);
      c.fillStyle = '#0a0c11';
      c.beginPath();
      c.moveTo(p[0]-w_, p[1]+h_*0.2); c.lineTo(p[0]-w_*0.4, p[1]-h_);
      c.lineTo(p[0]+w_*0.5, p[1]-h_*0.9); c.lineTo(p[0]+w_, p[1]+h_*0.1);
      c.lineTo(p[0], p[1]+h_); c.closePath(); c.fill();
      if (this.blink < 0.4){
        c.fillStyle = '#dfe6f2';
        c.beginPath(); c.ellipse(p[0], p[1], R*0.055, R*0.026, 0, 0, 6.3); c.fill();
      }
      const b = this.brow*R*0.10;
      c.strokeStyle = 'rgba(14,17,24,0.94)'; c.lineWidth = R*0.050;
      c.beginPath();
      c.moveTo(p[0]-w_*1.25, p[1]-R*0.110-b);
      c.lineTo(p[0]+w_*1.20, p[1]-R*0.150+b*0.5);
      c.stroke();
    }

    const m = proj(this.MOUTH), mo = R*0.05 + this.mouth*R*0.20;
    c.fillStyle = '#0b0c11';
    c.beginPath();
    c.moveTo(m[0]-R*0.25, m[1]); c.lineTo(m[0]-R*0.09, m[1]-R*0.035);
    c.lineTo(m[0]+R*0.09, m[1]-R*0.035); c.lineTo(m[0]+R*0.25, m[1]);
    c.lineTo(m[0]+R*0.08, m[1]+mo); c.lineTo(m[0]-R*0.08, m[1]+mo);
    c.closePath(); c.fill();

    this.suit(c, W, H, cx, cy, R);
    this.scanlines(c, W, H);
    if (Math.random() < 0.012*M.jitter) this.glitch(c, W, H);
  },

  rays(c, W, H, vx, vy){
    const N = 130, L = Math.max(W,H)*1.7;
    c.globalAlpha = 0.28;
    for (let i = 0; i < N; i++){
      const a = (i/N)*Math.PI*2 + this.phase;
      const deg = ((a*180/Math.PI) % 360 + 360) % 360;
      c.strokeStyle = (deg >= 40 && deg < 140) ? '#60e8ce'
                    : deg < 230 ? '#ecd678'
                    : deg < 320 ? '#e8c4e0' : '#f0f0f0';
      c.lineWidth = i % 2 ? 2 : 1;
      c.beginPath(); c.moveTo(vx, vy);
      c.lineTo(vx + Math.cos(a)*L, vy + Math.sin(a)*L); c.stroke();
    }
    c.globalAlpha = 1;
  },

  suit(c, W, H, cx, cy, R){
    const sy = cy + R*1.30;
    c.fillStyle = '#14161e';
    c.beginPath();
    c.moveTo(cx-R*1.55, H); c.lineTo(cx-R*1.08, sy); c.lineTo(cx-R*0.34, sy-R*0.06);
    c.lineTo(cx+R*0.34, sy-R*0.06); c.lineTo(cx+R*1.08, sy); c.lineTo(cx+R*1.55, H);
    c.closePath(); c.fill();
    c.fillStyle = '#eef0f6';
    c.beginPath(); c.moveTo(cx-R*0.30, sy-R*0.08); c.lineTo(cx+R*0.30, sy-R*0.08);
    c.lineTo(cx+R*0.20, H); c.lineTo(cx-R*0.20, H); c.closePath(); c.fill();
    c.fillStyle = '#14161e';
    c.beginPath(); c.moveTo(cx-R*0.42, sy-R*0.08); c.lineTo(cx-R*0.03, sy+R*0.18);
    c.lineTo(cx-R*0.24, sy+R*0.80); c.closePath(); c.fill();
    c.fillStyle = '#0d0f15';
    c.beginPath(); c.moveTo(cx+R*0.42, sy-R*0.08); c.lineTo(cx+R*0.03, sy+R*0.18);
    c.lineTo(cx+R*0.24, sy+R*0.80); c.closePath(); c.fill();
    c.fillStyle = '#c6984a';
    c.beginPath();
    c.moveTo(cx, sy+R*0.12); c.lineTo(cx+R*0.085, sy+R*0.26); c.lineTo(cx+R*0.07, H);
    c.lineTo(cx-R*0.07, H); c.lineTo(cx-R*0.085, sy+R*0.26); c.closePath(); c.fill();
  },

  scanlines(c, W, H){
    c.fillStyle = 'rgba(0,0,0,0.24)';
    for (let y = 0; y < H; y += 3) c.fillRect(0, y, W, 1.2);
    const y = ((this.t*60) % (H+120)) - 60;
    const g = c.createLinearGradient(0, y, 0, y+60);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.5,'rgba(255,255,255,0.04)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(0, y, W, 60);
  },

  glitch(c, W, H){
    const y = Math.random()*H, h = 6 + Math.random()*30;
    const dx = (Math.random()-0.5)*38;
    try { c.putImageData(c.getImageData(0, y, W, h), dx, y); } catch {}
  }
};

window.addEventListener('resize', () => { if (face.open) face.size(); });


face.show();

const LINES = {
  dry: "The forecast is fourteen degrees and raining, sir. I would take the coat you claim not to need.",
  amused: "Your three o'clock has moved again. That is the third time. I am beginning to admire his commitment.",
  concerned: "The premises licence expires in nine days, sir, and you have not touched it. I would not leave it any longer.",
  flat: "Nothing booked today. Weather is overcast, sixteen degrees, no rain expected.",
  pleased: "The VAT return went off this morning. Four days early, which for you is practically punctual.",
  sharp: "That supplier has raised prices twice this quarter, sir. I would be asking questions rather than paying."
};

$('#say').onclick = () => {
  const line = LINES[face.mood];
  $('#cap').textContent = line;
  face.startTalk(line);
  setTimeout(() => { face.stopTalk(); }, line.split(/\s+/).length * 1.6 * 135 + 400);
};

document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-m]').forEach(x => x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  face.setMood(b.dataset.m);
  $('#say').click();
});
</script>
</body>
</html>
